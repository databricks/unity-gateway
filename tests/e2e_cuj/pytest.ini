[pytest]
testpaths = .
pythonpath = ../..
addopts = --strict-markers --tb=short
markers =
    managed: requires an admin CodingAgentConfig published on the selected workspace
    catalog_discovery: managed schema-scoped model discovery and inference
    workspace_isolated: reads preconfigured CUJ workspace state with isolated local sessions
    tui: real interactive terminal and completed task
    claude: only runs when Claude Code is explicitly selected
    codex: only runs when Codex is explicitly selected
