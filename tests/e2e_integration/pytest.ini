[pytest]
testpaths = tests
python_files = test_cuj_*.py
python_functions = test_cuj_*
addopts = --strict-markers --tb=short
markers =
    live: full journey against a real workspace, without stubbed configuration
    tui: real interactive terminal task and normal exit
    claude: requires the explicitly selected Claude Code version
    codex: requires the explicitly selected Codex version
