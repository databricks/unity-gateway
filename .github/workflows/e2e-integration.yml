name: Full E2E CUJs

# Manual-only while the scaffold and first executable CUJ land separately.
# Empty collection fails; this is not a required PR check yet.
on:
  workflow_dispatch:
    inputs:
      ug_version:
        description: Exact ug release, or checkout
        type: string
        default: checkout
        required: true
      claude_version:
        description: Exact Claude Code version
        type: string
        default: 2.1.280
        required: true
      codex_version:
        description: Exact Codex version
        type: string
        default: 0.154.0
        required: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover full E2E CUJs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - name: Collect every CUJ without workspace credentials
        id: collect
        shell: bash
        run: |
          uv run --no-project --python 3.12 --with pytest==9.0.3 --with pexpect==4.9.0 --with pyte==0.8.2 \
            python -m pytest -c tests/e2e_integration/pytest.ini \
            --confcutdir=tests/e2e_integration tests/e2e_integration \
            --collect-only -q --cuj-matrix-output "$RUNNER_TEMP/cuj-matrix.json"
          matrix="$(jq -c . "$RUNNER_TEMP/cuj-matrix.json")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  cuj:
    name: Dedicated workspace · ${{ matrix.name }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-22.04
    # Distinct tests have distinct workspaces. Coordinate repeats of the same
    # workspace across branches without cancelling active cleanup.
    concurrency:
      group: full-e2e-cuj-${{ matrix.workspace_key }}
      cancel-in-progress: false
    # Above the runner's 3600s pytest deadline to leave room for cleanup.
    timeout-minutes: 75
    env:
      CUJ_WORKSPACE: ${{ matrix.workspace }}
      CUJ_NODEID: ${{ matrix.nodeid }}
      NEEDS_CLAUDE: ${{ matrix.claude }}
      NEEDS_CODEX: ${{ matrix.codex }}
      UG_VERSION: ${{ inputs.ug_version }}
      CLAUDE_VERSION: ${{ inputs.claude_version }}
      CODEX_VERSION: ${{ inputs.codex_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0

      - name: Verify the native agent sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --ro-bind / / --unshare-user --proc /proc --dev /dev /usr/bin/true

      - name: Run the discovered CUJ
        shell: bash
        env:
          UG_CUJ_SP_CLIENT_ID: ${{ secrets.UG_CUJ_SP_CLIENT_ID }}
          UG_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_CUJ_SP_CLIENT_SECRET }}
        run: |
          : "${UG_CUJ_SP_CLIENT_ID:?Set the UG_CUJ_SP_CLIENT_ID GitHub Actions secret}"
          : "${UG_CUJ_SP_CLIENT_SECRET:?Set the UG_CUJ_SP_CLIENT_SECRET GitHub Actions secret}"
          agents=()
          if [[ "$NEEDS_CLAUDE" == true ]]; then
            agents+=(--claude-version "$CLAUDE_VERSION")
          fi
          if [[ "$NEEDS_CODEX" == true ]]; then
            agents+=(--codex-version "$CODEX_VERSION")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --suite e2e-integration --python 3.12 --ug-version "$UG_VERSION" \
            "${agents[@]}" --workspace "$CUJ_WORKSPACE" --cuj-nodeid "$CUJ_NODEID" \
            --output "$RUNNER_TEMP/ug-e2e-integration"

      - name: Upload full E2E CUJ evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: full-e2e-cuj-${{ matrix.artifact_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-e2e-integration/*.json
            ${{ runner.temp }}/ug-e2e-integration/*.txt
            ${{ runner.temp }}/ug-e2e-integration/*.xml
            ${{ runner.temp }}/ug-e2e-integration/*.log
            ${{ runner.temp }}/ug-e2e-integration/artifacts/
            ${{ runner.temp }}/ug-e2e-integration/wheels/
