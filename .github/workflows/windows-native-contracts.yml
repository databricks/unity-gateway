name: Windows native global contracts

on:
  push:
    branches: [masonc08/windows-global-native-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Native loading · ${{ matrix.desktop }} · ${{ matrix.capability }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - capability: code-enterprise
            desktop: 2.42304.2
            installer_url: https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix
            installer_sha256: D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9
          - capability: cowork-enterprise
            desktop: 3.6556.2
            installer_url: https://downloads.claude.ai/releases/win32/x64/3.6556.2/Claude-20c019a1e61fa5b687616af57d31f97bb3181723.msix
            installer_sha256: C0AC245C9AD458ABD550BCBF2A0B34C75C51173A27F3C870602E5452CF3484F1
          - capability: cowork-both
            desktop: 3.6556.2
            installer_url: https://downloads.claude.ai/releases/win32/x64/3.6556.2/Claude-20c019a1e61fa5b687616af57d31f97bb3181723.msix
            installer_sha256: C0AC245C9AD458ABD550BCBF2A0B34C75C51173A27F3C870602E5452CF3484F1
    env:
      PYTHONUTF8: 1
      CAPABILITY: ${{ matrix.capability }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Cowork test scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/cowork-inference/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & ./scripts/cowork-inference/test-diagnostics.ps1
      - name: Require a clean machine configuration
        shell: pwsh
        run: |
          python -c "from scripts.run_integration import managed_policy_paths, present_policy_paths, present_registry_policies; found = present_policy_paths(managed_policy_paths(['claude'])) + present_registry_policies(['claude']); raise SystemExit('Existing machine configuration: ' + ', '.join(found) if found else 0)"
          if ($LASTEXITCODE -ne 0) { throw 'Machine configuration preflight failed' }
      - name: Download and verify the approved Claude installer
        shell: pwsh
        env:
          INSTALLER_URL: ${{ matrix.installer_url }}
          INSTALLER_SHA256: ${{ matrix.installer_sha256 }}
        run: |
          if ($env:INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'An installer SHA256 is required'
          }
          $installer = Join-Path $env:RUNNER_TEMP 'Claude.msix'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -TimeoutSec 300
          $digest = $env:INSTALLER_SHA256
          & ./scripts/cowork-inference/install-desktop.ps1 -InstallerPath $installer `
            -ExpectedSha256 $digest `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
      - name: Install UG and pinned Claude CLI
        shell: pwsh
        run: |
          ./scripts/cowork-inference/install-dependencies.ps1 -SharedRuntime
          (Join-Path ([Environment]::GetEnvironmentVariable('ProgramW6432')) 'UnityGatewayNativeTest/ug/Scripts') | Add-Content $env:GITHUB_PATH
      - name: Configure Desktop with existing CI credentials
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare administrator-authored native skill inputs
        timeout-minutes: 5
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          ./scripts/cowork-inference/prepare-native.ps1 -Capability $env:CAPABILITY `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/native"
      - name: Exercise the native skill and hooks
        timeout-minutes: 10
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          if ($env:CAPABILITY -eq 'cli-enterprise') {
            & "$PSHOME/pwsh.exe" -NoProfile -File scripts/cowork-inference/test-native-cli.ps1 `
              -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/native"
          } else {
            & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-native.ps1 `
              -Capability $env:CAPABILITY -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/native"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Revert UG configuration
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          if ($env:UG_COWORK_TEST_BINARY) {
            & $env:UG_COWORK_TEST_BINARY revert
            if ($LASTEXITCODE -ne 0) { throw 'UG cleanup failed' }
          }
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: native-contract-${{ matrix.desktop }}-${{ matrix.capability }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
            ${{ runner.temp }}/cowork-inference/native/
          if-no-files-found: warn
