name: UG Review Smoke (temporary)

# Add `ug-review` or `code-review` to an in-repo PR, or have an org member comment
# `/ug-review` on any PR. Fork PR events do not receive the gateway secret.
# The reviewer always checks out the default branch, never PR-controlled code.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  review:
    name: Review with the UG rubric
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ug-review-smoke-20261015' &&
        github.actor == 'rohita5l' &&
        contains(fromJSON('["ug-review", "code-review"]'), github.event.label.name)
      }}
    # Job-level so ordinary PR comments, which skip this job, never cancel a review.
    concurrency:
      group: ug-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 20
    env:
      DATABRICKS_HOST: https://ai-oss-ecosystem-integration-testing.cloud.databricks.com
      ANTHROPIC_BASE_URL: https://ai-oss-ecosystem-integration-testing.cloud.databricks.com/ai-gateway/anthropic
      ANTHROPIC_DEFAULT_HAIKU_MODEL: system.ai.claude-haiku-5-5
      ANTHROPIC_DEFAULT_SONNET_MODEL: system.ai.sonnet-5-5
      ANTHROPIC_DEFAULT_OPUS_MODEL: system.ai.claude-opus-5-5
      ANTHROPIC_CUSTOM_HEADERS: "x-databricks-use-coding-agent-mode: true"
      CLAUDE_CODE_USE_GATEWAY: "1"
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Check out the explicitly reviewed smoke-test commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: b5b786e1e54a035de08ed51027654ff37663eb8d
          sparse-checkout: |
            .github/scripts/ug-review
            .github/ug-review-instructions.md
            AGENTS.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare the trusted review policy
        run: cat AGENTS.md .github/ug-review-instructions.md > "$RUNNER_TEMP/ug-review-policy.md"

      - name: Authenticate to the existing Databricks gateway
        id: gateway-auth
        env:
          DATABRICKS_CLIENT_ID: 6476a5e7-7f32-4073-abc5-ee30bb7d0060
          DATABRICKS_CLIENT_SECRET: ${{ secrets.UG_CLI_REVIEW_BOT_SP_CLIENT_SECRET }}
        run: python3 .github/scripts/ug-review/auth.py

      - name: Review the pull request with Claude and inline comments
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ug-review-claude-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ steps.gateway-auth.outputs.token }}
          classify_inline_comments: "false"
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: "/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}"
          claude_args: >-
            --model sonnet
            --append-system-prompt-file ${{ runner.temp }}/ug-review-policy.md
            --append-subagent-system-prompt-file ${{ runner.temp }}/ug-review-policy.md
            --setting-sources user,project
            --permission-mode dontAsk
            --allowedTools "Agent,Skill,Read,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
