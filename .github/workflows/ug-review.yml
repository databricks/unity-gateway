name: UG Review

# The reviewer always runs trusted code from the default branch. PR-controlled
# metadata and patches are fetched as untrusted text and are never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: ug-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review with the UG rubric
    if: >-
      ${{
        !github.event.pull_request.draft &&
        contains(github.event.pull_request.labels.*.name, 'ug-review') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ug-review')
      }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted reviewer from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/ug-review/review.py
            .github/ug-review-instructions.md
            AGENTS.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Review the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DATABRICKS_HOST: https://ai-oss-ecosystem-integration-testing.cloud.databricks.com
          DATABRICKS_CLIENT_ID: 6476a5e7-7f32-4073-abc5-ee30bb7d0060
          DATABRICKS_CLIENT_SECRET: ${{ secrets.UG_CLI_REVIEW_BOT_SP_CLIENT_SECRET }}
          UG_REVIEW_MODEL: ${{ vars.UG_CI_REVIEW_MODEL }}
          REVIEW_POLICY_PATH: .github/ug-review-instructions.md
          REPOSITORY_POLICY_PATH: AGENTS.md
        run: |
          : "${UG_REVIEW_MODEL:?Set UG_CI_REVIEW_MODEL to a Responses-capable model}"
          python3 .github/scripts/ug-review/review.py
