name: Native Codex Windows controls diagnostic

on:
  workflow_dispatch:
  push:
    branches: [JJ27/codex-native-v2-comprehensive-20261030]

permissions:
  contents: read

jobs:
  native:
    name: Controls on ${{ matrix.source }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest]
        codex: [0.165.0]
        source: [candidate, baseline]
    env:
      PYTHONUTF8: 1
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.13.5
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a
        with:
          version: 1.17.0
      - name: Expose the Windows Databricks CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $databricks = Join-Path $env:RUNNER_TEMP ".bin/databricks.exe"
          if (-not (Test-Path -LiteralPath $databricks -PathType Leaf)) {
            throw "setup-cli did not install the expected executable"
          }
          Split-Path -Parent $databricks | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $databricks version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the selected source
        shell: pwsh
        env:
          CODEX_VERSION: ${{ matrix.codex }}
          SOURCE_VARIANT: ${{ matrix.source }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "native-controls"
          $sourceArgs = @("--ug-version", "checkout")
          $sourceRef = $env:GITHUB_SHA
          if ($env:SOURCE_VARIANT -eq "baseline") {
            $sourceRef = "3426837be53ef53db705619c35a4e6f4122b828d"
            $baseline = Join-Path $env:RUNNER_TEMP "baseline-source"
            git worktree add --detach $baseline 3426837be53ef53db705619c35a4e6f4122b828d
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $wheels = Join-Path $env:RUNNER_TEMP "baseline-wheels"
            uv build --wheel --out-dir $wheels $baseline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $wheel = @(Get-ChildItem -LiteralPath $wheels -Filter *.whl)
            if ($wheel.Count -ne 1) { throw "Expected exactly one baseline wheel" }
            $sourceArgs = @("--ug-wheel", $wheel[0].FullName)
          }
          uv run --no-project --python 3.12 python scripts/run_integration.py `
            --python 3.12 @sourceArgs --codex-version $env:CODEX_VERSION `
            --default-index https://pypi.org/simple --output $output `
            -- -k test_ug_codex_windows_session_controls
          $testExit = $LASTEXITCODE
          @{ source = $env:SOURCE_VARIANT; installed_source = $sourceRef; suite_source = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content -Path (Join-Path $output "source-variant.json") -Encoding utf8
          exit $testExit
      - name: Upload native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-controls-${{ matrix.source }}-${{ matrix.codex }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/native-controls/*.json
            ${{ runner.temp }}/native-controls/*.txt
            ${{ runner.temp }}/native-controls/*.xml
            ${{ runner.temp }}/native-controls/*.log
            ${{ runner.temp }}/native-controls/artifacts/
