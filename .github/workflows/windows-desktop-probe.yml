name: Windows desktop capability probe

on:
  push:
    branches: [masonc08/windows-desktop-probe]
  workflow_dispatch:
    inputs:
      installer_url:
        description: Approved internal URL for the Claude x64 MSIX
        type: string
        default: ''
      installer_sha256:
        description: SHA256 of the approved installer
        type: string
        default: ''
      try_playwright:
        description: Recheck Electron attachment; Claude 2.42304.2 rejects debug switches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Validate app probe scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/desktop-probe/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          & $node --check scripts/desktop-probe/attach.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect desktop and virtualization prerequisites
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/windows_desktop_probe.ps1 `
            -OutputPath "$env:RUNNER_TEMP/windows-desktop-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload capability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-desktop-capabilities
          path: ${{ runner.temp }}/windows-desktop-probe.json
          if-no-files-found: error

  app-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify the approved Claude installer
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.installer_url || 'https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix' }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 || 'D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9' }}
        run: |
          $uri = [Uri]$env:INSTALLER_URL
          $official = $uri.Host -eq 'downloads.claude.ai' -and $uri.AbsolutePath.StartsWith('/releases/win32/x64/')
          if ($uri.Scheme -ne 'https' -or
              (-not $official -and $uri.Host -ne 'databricks.jfrog.io' -and -not $uri.Host.EndsWith('.cloud.databricks.com'))) {
            throw 'Installer must come from the approved Anthropic endpoint or an internal source'
          }
          if ($env:INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'An installer SHA256 is required'
          }
          $installer = Join-Path $env:RUNNER_TEMP 'Claude.msix'
          Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 300
          $digest = $env:INSTALLER_SHA256
          & ./scripts/desktop-probe/install.ps1 -InstallerPath $installer `
            -ExpectedSha256 $digest `
            -OutputDirectory "$env:RUNNER_TEMP/claude-desktop-probe"
      - name: Install pinned Playwright through JFrog
        if: inputs.try_playwright == true
        shell: pwsh
        run: ./scripts/desktop-probe/install-playwright.ps1
      - name: Check native Claude launch
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/desktop-probe/native-launch.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/claude-desktop-probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch Claude and inspect Cowork
        if: inputs.try_playwright == true
        shell: pwsh
        env:
          DEBUG: pw:browser
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          & $node scripts/desktop-probe/attach.mjs $env:CLAUDE_DESKTOP_EXECUTABLE `
            "$env:RUNNER_TEMP/claude-desktop-probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload app probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: claude-desktop-probe
          retention-days: 3
          path: |
            ${{ runner.temp }}/claude-desktop-probe/*.json
            ${{ runner.temp }}/claude-desktop-probe/*.png
            ${{ runner.temp }}/claude-desktop-probe/*-ui.txt
            ${{ runner.temp }}/claude-desktop-probe/native-*.log
          if-no-files-found: warn
