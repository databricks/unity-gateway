name: harness-latest

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-latest-${{ github.ref }}
  cancel-in-progress: false

env:
  UG_VERSION: checkout
  ENTRY_POINT: ug
  PACKAGE_INDEX: https://pypi.org/simple

jobs:
  resolve-versions:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      claude: ${{ steps.versions.outputs.claude }}
      codex: ${{ steps.versions.outputs.codex }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - name: Resolve the latest agent versions
        id: versions
        shell: bash
        run: |
          latest_claude=$(npm view @anthropic-ai/claude-code@latest version)
          echo "claude=$latest_claude" >> "$GITHUB_OUTPUT"
          latest_codex=$(npm view @openai/codex@latest version)
          echo "codex=$latest_codex" >> "$GITHUB_OUTPUT"

  # The latest-agent harness currently covers smart routing only.
  harness-latest:
    name: harness-latest · ${{ matrix.suite }}
    needs: resolve-versions
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        suite: [cujs, live, managed]
    env:
      CLAUDE_VERSION: ${{ needs.resolve-versions.outputs.claude }}
      CODEX_VERSION: ${{ needs.resolve-versions.outputs.codex }}
      UV_INDEX_URL: https://pypi.org/simple
      UG_CUJ1_WORKSPACE: ${{ secrets.UG_CUJ1_WORKSPACE }}
      UG_CUJ_SP_CLIENT_ID: ${{ secrets.UG_CUJ_SP_CLIENT_ID }}
      UG_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_CUJ_SP_CLIENT_SECRET }}
      UG_BUDGET_CUJ_SP_CLIENT_ID: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_ID }}
      UG_BUDGET_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_SECRET }}
      UCODE_TEST_WORKSPACE: ${{ matrix.suite == 'managed' && secrets.E2E_ADMIN_WORKSPACE || secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ matrix.suite != 'managed' && secrets.DATABRICKS_BEARER || '' }}
      DATABRICKS_CLIENT_ID: ${{ matrix.suite == 'managed' && secrets.E2E_ADMIN_SP_CLIENT_ID || '' }}
      DATABRICKS_CLIENT_SECRET: ${{ matrix.suite == 'managed' && secrets.E2E_ADMIN_SP_CLIENT_SECRET || '' }}
      TEST_MARKER: ${{ matrix.suite == 'managed' && 'harness_latest and managed_fixture' || 'harness_latest and not managed_fixture' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9  # v1.21.0
        with:
          version: 1.17.0
      - name: Record the latest agent versions
        shell: bash
        run: |
          printf 'claude=%s\ncodex=%s\n' "$CLAUDE_VERSION" "$CODEX_VERSION" \
            | tee "$RUNNER_TEMP/harness-latest-versions.txt"
      - name: Install ug and latest agent CLIs for opted-in CUJs
        if: ${{ matrix.suite == 'cujs' }}
        run: |
          uv lock
          uv tool install .
          npm install -g \
            "@anthropic-ai/claude-code@$CLAUDE_VERSION" \
            "@openai/codex@$CODEX_VERSION"
      - name: Run opted-in CUJs against the latest agents
        if: ${{ matrix.suite == 'cujs' }}
        run: |
          uv run --with pexpect==4.9.0 --with pyte==0.8.2 \
            pytest --confcutdir=tests/e2e_cuj tests/e2e_cuj \
            -m harness_latest -v --basetemp "$RUNNER_TEMP/cuj"
      - name: Run opted-in integration tests against the latest agents
        if: ${{ matrix.suite != 'cujs' }}
        shell: bash
        run: |
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" \
            -- -m "$TEST_MARKER"
      - name: Upload latest harness evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: harness-latest-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/harness-latest-versions.txt
            ${{ runner.temp }}/cuj/*/artifacts/
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  notify:
    needs: [resolve-versions, harness-latest]
    if: ${{ always() && (needs.harness-latest.result == 'success' || needs.harness-latest.result == 'failure' || needs.resolve-versions.result == 'failure') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the Slack notifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          sparse-checkout: .github/scripts/slack-notify/notify.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Notify Slack of the result
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_UG_CODING_AGENTS_POD }}
          GH_TOKEN: ${{ github.token }}
          NOTIFY_NAME: Latest harness test
          NOTIFY_RESULT: ${{ needs.harness-latest.result }}
          CLAUDE_VERSION: ${{ needs.resolve-versions.outputs.claude }}
          CODEX_VERSION: ${{ needs.resolve-versions.outputs.codex }}
        run: python3 .github/scripts/slack-notify/notify.py
