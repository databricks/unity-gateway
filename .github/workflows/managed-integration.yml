name: Managed integration (signal)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# This workflow is intentionally independent from ci.yml. A hosted-runner shutdown here must not
# cancel the reusable Integration workflow or the repository's required `e2e` check.
concurrency:
  group: managed-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UG_VERSION: checkout
  ENTRY_POINT: ug
  CLAUDE_VERSION: 2.1.268
  CODEX_VERSION: 0.154.0
  PACKAGE_INDEX: https://pypi.org/simple

jobs:
  managed:
    name: Managed config · ${{ matrix.label }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: Claude
            marker: (managed or managed_fixture) and claude
            keyword: ''
            artifact: integration-managed-claude
          - label: Codex · workspace
            marker: managed and codex
            keyword: ''
            artifact: integration-managed-codex-workspace
          - label: Codex · discovery policy
            marker: managed_fixture and codex
            keyword: ug_codex_managed_model_discovery
            artifact: integration-managed-codex-discovery
          - label: Codex · remaining fixtures
            marker: managed_fixture and codex
            keyword: not ug_codex_managed_model_discovery
            artifact: integration-managed-codex-fixtures
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
      - name: Run the managed shard against the managed e2e workspace
        shell: bash
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
          TEST_MARKER: ${{ matrix.marker }}
          TEST_KEYWORD: ${{ matrix.keyword }}
        run: |
          # A managed config applies to every enabled agent, so both CLIs are required by each shard.
          pytest_args=(-m "$TEST_MARKER")
          if [[ -n "$TEST_KEYWORD" ]]; then
            pytest_args+=(-k "$TEST_KEYWORD")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            -- "${pytest_args[@]}"
      - name: Upload managed test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
