name: Required Security Verification

# An organization ruleset must select this file from protected main. A required
# check name alone does not prevent a PR from changing its own verifier.
on:
  pull_request:
  merge_group:

permissions:
  actions: read

jobs:
  verify:
    name: Verify trusted scan
    # zizmor: ignore[unpinned-uses] security policy intentionally follows protected main
    uses: databricks/unity-gateway/.github/workflows/security-gate.yml@main
