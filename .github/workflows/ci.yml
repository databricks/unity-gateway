name: CI
run-name: 'CI #${{ github.event.pull_request.number || github.run_id }}'

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: 1

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  security-gate:
    name: Security Gate
    permissions:
      actions: read
    uses: ./.github/workflows/security-gate.yml

  lint:
    name: Lint
    # Every job that runs PR code waits on the gate, so a scan finding skips them all.
    needs: security-gate
    runs-on: ubuntu-latest
    env:
      # See the test job: hosted runners can't reach the internal pypi-proxy,
      # so resolve against public PyPI (paired with the `uv lock` step below).
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b  # v3
        with:
          just-version: 1.58.0
      - run: uv lock
      # Same recipe developers run locally, so lint stays identical in both places.
      - run: just lint

  test:
    name: Unit tests · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    needs: security-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # uv.lock pins packages to Databricks' internal pypi-proxy, which hosted
      # GitHub runners can't reach (downloads time out). Re-resolve against
      # public PyPI at CI time: UV_INDEX_URL + a `uv lock` before install.
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Install dependencies
        run: |
          uv lock
          uv sync
      - name: Trust a disposable test CA in the Windows certificate store
        # tests/test_tls_https.py checks that ug verifies a server whose root is only in the OS
        # trust store. On Linux that store is a CA bundle file the test points OpenSSL at.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "ug-test-ca"
          uv run --no-sync python tests/tls_ca.py $directory
          certutil -addstore -f Root (Join-Path $directory "ca.pem")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UG_TEST_OS_TRUSTED_CA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: uv run --no-sync pytest --ignore=tests/test_e2e.py
      - name: Windows provisioning helpers (Windows PowerShell 5.1)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: ./tests/mdm/windows-provision.Tests.ps1
      - name: Windows provisioning helpers (PowerShell 7)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./tests/mdm/windows-provision.Tests.ps1

  claude-mod:
    name: Claude mod · 2.1.290
    runs-on: ubuntu-latest
    needs: security-gate
    timeout-minutes: 10
    env:
      UV_INDEX_URL: https://pypi.org/simple
      UCODE_TEST_CLAUDE_VERSION: 2.1.290
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - run: npm install -g @anthropic-ai/claude-code@2.1.290
      - run: uv lock
      - name: Validate and test the mod entry point
        run: |
          export UCODE_TEST_CLAUDE_BINARY="$(command -v claude)"
          uv run pytest tests/native_claude/test_mod.py tests/native_claude/test_credentials.py -q

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: security-gate
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: GitHub Copilot app plugin tests
        run: node --test ../tests/*.test.mjs
      # ug packs the extension from these committed files, so they must match the sources.
      - name: Check the committed bundle is up to date
        run: |
          npm run build
          test -z "$(git status --porcelain -- ../src/ucode/vscode/extension)" || {
            echo "::error::The VS Code extension bundle is stale. Run \`just vscode-build\` and commit the result."
            exit 1
          }

  # Pull requests run the live suites only when their diff can reach them
  # (scripts/ci_select.py); every other event, including the merge queue, runs them all.
  changes:
    name: Select live suites
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live: ${{ steps.select.outputs.live }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/ci_select.py "$BASE_SHA" "$HEAD_SHA" | tee selection.txt
            tail -n 1 selection.txt >> "$GITHUB_OUTPUT"
          else
            echo "live=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-shards:
    name: ${{ matrix.name }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    needs: [security-gate, changes]
    if: ${{ needs.changes.outputs.live == 'true' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [gateway, claude, codex, gemini, opencode, copilot, pi]
        include:
          - group: gateway
            name: Gateway API tests
            keyword: not (TestCodexLaunch or TestClaudeLaunch or TestConfigureSubset or TestGeminiLaunch or TestGeminiFreshInstall or TestGeminiAuthRecovery or TestOpencodeLaunch or TestCopilotLaunch or TestPiLaunch)
            package: ''
          - group: claude
            name: Agent launch tests · Claude
            keyword: TestClaudeLaunch or TestConfigureSubset
            package: '@anthropic-ai/claude-code'
          - group: codex
            name: Agent launch tests · Codex
            keyword: TestCodexLaunch
            package: '@openai/codex'
          - group: gemini
            name: Agent launch tests · Gemini
            keyword: TestGeminiLaunch or TestGeminiFreshInstall or TestGeminiAuthRecovery
            package: '@google/gemini-cli'
          - group: opencode
            name: Agent launch tests · OpenCode
            keyword: TestOpencodeLaunch
            package: opencode-ai@1
          - group: copilot
            name: Agent launch tests · Copilot
            keyword: TestCopilotLaunch
            package: '@github/copilot@1.0.91'
          - group: pi
            name: Agent launch tests · Pi
            keyword: TestPiLaunch
            package: '@earendil-works/pi-coding-agent'
    env:
      # See the test job: hosted runners can't reach the internal pypi-proxy,
      # so resolve against public PyPI (paired with the `uv lock` step below).
      UV_INDEX_URL: https://pypi.org/simple
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_HOST: ${{ secrets.UCODE_TEST_WORKSPACE }}
      # DATABRICKS_BEARER is the CI escape hatch: `databricks auth token`
      # only retrieves cached user-OAuth tokens, so on a hosted runner
      # (no databrickscfg, no cached login) it can never produce a bearer.
      # Pre-fetch one (e.g. via M2M OAuth client_credentials against
      # /oidc/v1/token) and store it as a repo secret. Both
      # has_valid_databricks_auth + get_databricks_token + the agents'
      # apiKeyHelper short-circuit to this value when set. Tokens are
      # short-lived (~1h); rotate when CI starts failing with 401s.
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      AGENT_PACKAGE: ${{ matrix.package }}
      TEST_KEYWORD: ${{ matrix.keyword }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
      - name: Expose the Databricks CLI on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          test -f "$RUNNER_TEMP/.bin/databricks.exe"
          cygpath -w "$RUNNER_TEMP/.bin" >> "$GITHUB_PATH"
      - name: Install the shard's agent CLI
        if: ${{ matrix.package != '' }}
        run: npm install -g "$AGENT_PACKAGE"
      - name: Install ug and test dependencies
        run: |
          uv lock
          uv tool install .
          uv sync
      # Redirect stdin so any interactive `databricks auth login --no-browser`
      # fallback EOFs instead of hanging the runner. With DATABRICKS_BEARER
      # set, the auth code path doesn't shell out at all — this is a safety
      # net for any code path we may have missed.
      # Rerun a case once only for live-service timeouts and transient upstream errors;
      # every other failure fails on the first attempt. `-rfER` lists reruns in the summary.
      - run: |
          uv run --no-sync pytest tests/test_e2e.py -v -rfER -k "$TEST_KEYWORD" \
            --reruns 1 --reruns-delay 5 \
            --only-rerun TimeoutExpired \
            --only-rerun 'timed out after [0-9]+s' \
            --only-rerun 'TIMEOUT after' \
            --only-rerun TEMPORARILY_UNAVAILABLE \
            --only-rerun REQUEST_LIMIT_EXCEEDED \
            < /dev/null

  e2e:
    name: All agent tests
    if: ${{ !cancelled() }}
    needs: [changes, e2e-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every e2e shard to pass, unless selection skipped them
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          LIVE: ${{ needs.changes.outputs.live }}
          RESULT: ${{ needs.e2e-shards.result }}
        run: |
          test "$SELECTION_RESULT" = success &&
            { test "$RESULT" = success || { test "$LIVE" = false && test "$RESULT" = skipped; }; }

  integration:
    name: Integration
    needs: [security-gate, changes]
    # Integration needs CI secrets, so it runs only after the security gate passes.
    if: ${{ needs.security-gate.result == 'success' && needs.changes.outputs.live == 'true' && !cancelled() }}
    uses: ./.github/workflows/integration.yml
    secrets: inherit  # zizmor: ignore[secrets-inherit] same-repo workflow that needs nearly every secret

  # Preserve the exact contexts required by the repository's branch rules.
  # Keep these aliases until the rules and all active branches migrate together.
  required-tests:
    name: test
    if: ${{ !cancelled() }}
    needs: [lint, test, vscode-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint, unit and VS Code extension tests to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          RESULT: ${{ needs.test.result }}
          VSCODE_EXTENSION_RESULT: ${{ needs.vscode-extension.result }}
        run: |
          test "$LINT_RESULT" = success && test "$RESULT" = success &&
            test "$VSCODE_EXTENSION_RESULT" = success

  required-e2e:
    name: e2e
    if: ${{ !cancelled() }}
    needs: [changes, e2e, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all agent and integration tests to pass, unless selection skipped them
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          LIVE: ${{ needs.changes.outputs.live }}
          RESULT: ${{ needs.e2e.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$SELECTION_RESULT" = success && test "$RESULT" = success && {
            test "$INTEGRATION_RESULT" = success ||
              { test "$LIVE" = false && test "$INTEGRATION_RESULT" = skipped; }
          }
