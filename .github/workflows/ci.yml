name: Claude Desktop CDP-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdp-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Validate probe scripts
        shell: pwsh
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/cdp-probe/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          node --check scripts/cdp-probe/attach.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify the approved Claude installer
        shell: pwsh
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          INSTALLER_URL: https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix
          INSTALLER_SHA256: D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9
        run: |
          if ($env:INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'An installer SHA256 is required'
          }
          $installer = Join-Path $env:RUNNER_TEMP 'Claude.msix'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -TimeoutSec 300
          $digest = $env:INSTALLER_SHA256
          & ./scripts/cowork-inference/install-desktop.ps1 -InstallerPath $installer `
            -ExpectedSha256 $digest `
            -OutputDirectory "$env:RUNNER_TEMP/cdp-probe"
      - name: Install pinned Playwright through JFrog
        shell: pwsh
        run: ./scripts/cdp-probe/install-playwright.ps1
      - name: Compare normal launch with CDP-only launch
        shell: pwsh
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: ./scripts/cdp-probe/probe.ps1 -OutputDirectory "$env:RUNNER_TEMP/cdp-probe"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: claude-cdp-only-probe
          retention-days: 3
          path: |
            ${{ runner.temp }}/cdp-probe/*.json
            ${{ runner.temp }}/cdp-probe/*.log
          if-no-files-found: error
