name: CI

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: 1

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # See the test job: hosted runners can't reach the internal pypi-proxy,
      # so resolve against public PyPI (paired with the `uv lock` step below).
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b  # v3
        with:
          just-version: 1.58.0
      - run: uv lock
      # Same recipe developers run locally, so lint stays identical in both places.
      - run: just lint

  test:
    name: Unit tests · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # uv.lock pins packages to Databricks' internal pypi-proxy, which hosted
      # GitHub runners can't reach (downloads time out). Re-resolve against
      # public PyPI at CI time: UV_INDEX_URL + a `uv lock` before install.
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Install dependencies
        run: |
          uv lock
          uv sync
      - run: uv run --no-sync pytest --ignore=tests/test_e2e.py

  claude-mod:
    name: Claude mod · 2.1.290
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    env:
      UV_INDEX_URL: https://pypi.org/simple
      UCODE_TEST_CLAUDE_VERSION: 2.1.290
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - run: npm install -g @anthropic-ai/claude-code@2.1.290
      - run: uv lock
      - name: Validate and test the mod entry point
        run: |
          export UCODE_TEST_CLAUDE_BINARY="$(command -v claude)"
          uv run pytest tests/native_claude/test_mod.py tests/native_claude/test_credentials.py -q

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # ug packs the extension from these committed files, so they must match the sources.
      - name: Check the committed bundle is up to date
        run: |
          npm run build
          test -z "$(git status --porcelain -- ../src/ucode/vscode/extension)" || {
            echo "::error::The VS Code extension bundle is stale. Run \`just vscode-build\` and commit the result."
            exit 1
          }

  e2e-shards:
    name: ${{ matrix.name }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    needs: lint
    # The merge queue runs only lint and unit tests; e2e already ran on the PR.
    if: ${{ github.event_name != 'merge_group' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [gateway, claude, codex, gemini, opencode, copilot, pi]
        include:
          - group: gateway
            name: Gateway API tests
            keyword: not (TestCodexLaunch or TestClaudeLaunch or TestConfigureSubset or TestModelProviderLaunch or TestGeminiLaunch or TestGeminiFreshInstall or TestGeminiAuthRecovery or TestOpencodeLaunch or TestCopilotLaunch or TestPiLaunch)
            package: ''
          - group: claude
            name: Agent launch tests · Claude
            keyword: TestClaudeLaunch or TestConfigureSubset or (TestModelProviderLaunch and not codex)
            package: '@anthropic-ai/claude-code'
          - group: codex
            name: Agent launch tests · Codex
            keyword: TestCodexLaunch
            package: '@openai/codex'
          - group: gemini
            name: Agent launch tests · Gemini
            keyword: TestGeminiLaunch or TestGeminiFreshInstall or TestGeminiAuthRecovery
            package: '@google/gemini-cli'
          - group: opencode
            name: Agent launch tests · OpenCode
            keyword: TestOpencodeLaunch
            package: opencode-ai@1
          - group: copilot
            name: Agent launch tests · Copilot
            keyword: TestCopilotLaunch
            package: '@github/copilot@1.0.91'
          - group: pi
            name: Agent launch tests · Pi
            keyword: TestPiLaunch
            package: '@earendil-works/pi-coding-agent'
    env:
      # See the test job: hosted runners can't reach the internal pypi-proxy,
      # so resolve against public PyPI (paired with the `uv lock` step below).
      UV_INDEX_URL: https://pypi.org/simple
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_HOST: ${{ secrets.UCODE_TEST_WORKSPACE }}
      # DATABRICKS_BEARER is the CI escape hatch: `databricks auth token`
      # only retrieves cached user-OAuth tokens, so on a hosted runner
      # (no databrickscfg, no cached login) it can never produce a bearer.
      # Pre-fetch one (e.g. via M2M OAuth client_credentials against
      # /oidc/v1/token) and store it as a repo secret. Both
      # has_valid_databricks_auth + get_databricks_token + the agents'
      # apiKeyHelper short-circuit to this value when set. Tokens are
      # short-lived (~1h); rotate when CI starts failing with 401s.
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      AGENT_PACKAGE: ${{ matrix.package }}
      TEST_KEYWORD: ${{ matrix.keyword }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
      - name: Expose the Databricks CLI on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          test -f "$RUNNER_TEMP/.bin/databricks.exe"
          cygpath -w "$RUNNER_TEMP/.bin" >> "$GITHUB_PATH"
      - name: Install the shard's agent CLI
        if: ${{ matrix.package != '' }}
        run: npm install -g "$AGENT_PACKAGE"
      - name: Install ug and test dependencies
        run: |
          uv lock
          uv tool install .
          uv sync
      # Redirect stdin so any interactive `databricks auth login --no-browser`
      # fallback EOFs instead of hanging the runner. With DATABRICKS_BEARER
      # set, the auth code path doesn't shell out at all — this is a safety
      # net for any code path we may have missed.
      # Rerun a case once only for live-service timeouts and transient upstream errors;
      # every other failure fails on the first attempt. `-rfER` lists reruns in the summary.
      - run: |
          uv run --no-sync pytest tests/test_e2e.py -v -rfER -k "$TEST_KEYWORD" \
            --reruns 1 --reruns-delay 5 \
            --only-rerun TimeoutExpired \
            --only-rerun 'timed out after [0-9]+s' \
            --only-rerun 'TIMEOUT after' \
            --only-rerun TEMPORARILY_UNAVAILABLE \
            --only-rerun REQUEST_LIMIT_EXCEEDED \
            < /dev/null

  cowork-inference-windows:
    name: Cowork inference · Windows
    runs-on: windows-latest
    needs: lint
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Cowork test scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/cowork-inference/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Download and verify the approved Claude installer
        shell: pwsh
        env:
          INSTALLER_URL: https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix
          INSTALLER_SHA256: D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9
        run: |
          $uri = [Uri]$env:INSTALLER_URL
          $official = $uri.Host -eq 'downloads.claude.ai' -and $uri.AbsolutePath.StartsWith('/releases/win32/x64/')
          if ($uri.Scheme -ne 'https' -or
              (-not $official -and $uri.Host -ne 'databricks.jfrog.io' -and -not $uri.Host.EndsWith('.cloud.databricks.com'))) {
            throw 'Installer must come from the approved Anthropic endpoint or an internal source'
          }
          if ($env:INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'An installer SHA256 is required'
          }
          $installer = Join-Path $env:RUNNER_TEMP 'Claude.msix'
          Invoke-WebRequest -Uri $uri -OutFile $installer -TimeoutSec 300
          $digest = $env:INSTALLER_SHA256
          & ./scripts/cowork-inference/install-desktop.ps1 -InstallerPath $installer `
            -ExpectedSha256 $digest `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
      - name: Install UG with existing Windows package infrastructure
        shell: pwsh
        run: ./scripts/cowork-inference/install-dependencies.ps1
      - name: Configure Desktop with existing CI credentials
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
          if-no-files-found: warn

  e2e:
    name: All agent tests
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    needs: e2e-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every e2e shard to pass
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: test "$RESULT" = success

  integration:
    name: Integration
    needs: lint
    # The condition runs integration tests only if lint passes and the overall workflow is not cancelled.
    if: ${{ github.event_name != 'merge_group' && needs.lint.result == 'success' && !cancelled() }}
    uses: ./.github/workflows/integration.yml
    secrets: inherit  # zizmor: ignore[secrets-inherit] same-repo workflow that needs nearly every secret

  # Preserve the exact contexts required by the repository's branch rules.
  # Keep these aliases until the rules and all active branches migrate together.
  required-tests:
    name: test
    if: ${{ !cancelled() }}
    needs: [test, vscode-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require unit and VS Code extension tests to pass
        env:
          RESULT: ${{ needs.test.result }}
          VSCODE_EXTENSION_RESULT: ${{ needs.vscode-extension.result }}
        run: test "$RESULT" = success && test "$VSCODE_EXTENSION_RESULT" = success

  required-e2e:
    name: e2e
    if: ${{ !cancelled() }}
    needs: [e2e, integration, cowork-inference-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all agent, integration, and Cowork tests to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT: ${{ needs.e2e.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COWORK_RESULT: ${{ needs.cowork-inference-windows.result }}
          COWORK_EXPECTED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'success' || 'skipped' }}
        run: |
          test "$EVENT_NAME" = merge_group || {
            test "$RESULT" = success &&
            test "$INTEGRATION_RESULT" = success &&
            test "$COWORK_RESULT" = "$COWORK_EXPECTED"
          }
