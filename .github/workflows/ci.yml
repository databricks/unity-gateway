name: Claude version A/B diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      UV_INDEX_URL: https://pypi.org/simple
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "6"
      UG_CUJ_SP_CLIENT_ID: ${{ secrets.UG_CUJ_SP_CLIENT_ID }}
      UG_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_CUJ_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba0d79ed9d429e08af3e7cf110e379c004a3a503
          path: baseline-ug
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.9.8
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a
        with:
          version: 1.17.0
      - name: Install identical baseline UG and both native Claude versions
        run: |
          uv lock
          uv tool install ./baseline-ug
          echo "UG_AB_BASELINE_BINARY=$(command -v ug)" >> "$GITHUB_ENV"
          npm install -g "@openai/codex@0.154.0"
          for version in 2.1.280 2.1.290; do
            npm install --prefix "$RUNNER_TEMP/claude-$version" "@anthropic-ai/claude-code@$version"
          done
      - name: Run the same strict TUI test in ABBA order with fresh homes
        shell: bash
        run: |
          overall=0
          arm=0
          for version in 2.1.280 2.1.290 2.1.290 2.1.280; do
            arm=$((arm + 1))
            export PATH="$RUNNER_TEMP/claude-$version/node_modules/.bin:$PATH"
            claude --version
            if uv run --with pexpect==4.9.0 --with pyte==0.8.2 \
              pytest --confcutdir=tests/e2e_cuj \
              tests/e2e_cuj/test_cuj3_models.py::TestCatalogDiscovery::test_catalog_discovery_claude_tui_uses_default \
              -v --basetemp "$RUNNER_TEMP/cuj-$arm-$version" \
              --junitxml "$RUNNER_TEMP/ab-results/$arm-$version.xml"; then
              echo "Arm $arm / Claude $version: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              overall=1
              echo "Arm $arm / Claude $version: FAIL (inspect wire evidence)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$overall"
      - name: Upload redacted wire evidence and strict test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-live-abba
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/cuj-*/*/artifacts/
            ${{ runner.temp }}/ab-results/
