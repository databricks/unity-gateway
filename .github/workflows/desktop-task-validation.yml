name: Desktop task validation
on:
  push:
    branches: [masonc08/desktop-tasks-validation]
permissions:
  contents: read
jobs:
  cowork-inference-macos:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]
    name: Cowork desktop tasks · macOS · run ${{ matrix.attempt }}
    runs-on: macos-15-intel
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: d41ebb87c8a4789d89ba13b6c1605b79be4c5bff
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - name: Install and verify Claude Desktop
        run: bash scripts/cowork-inference/macos/install-desktop.sh
      - name: Install UG checkout and pinned Claude CLI
        run: bash scripts/cowork-inference/macos/install-dependencies.sh
      - name: Configure and assert Cowork inference through macOS Accessibility
        id: cowork-inference
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py'
      - name: Assert Cowork file read
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability file'
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability skill'
      - name: Stop desktop processes
        if: always()
        run: |
          pkill -f '/Applications/Claude.app/Contents/' || test "$?" = 1
          pkill -x Terminal || test "$?" = 1
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-macos-${{ matrix.attempt }}
          retention-days: 3
          path: ${{ runner.temp }}/macos-cowork-evidence/
          if-no-files-found: warn

