name: macOS Cowork probe

on:
  push:
    branches: [masonc08/macos-desktop-probe]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: macos-desktop-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowork:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install and verify Claude Desktop
        run: bash scripts/macos-desktop-probe/install-desktop.sh
      - name: Authenticate to internal package registries
        id: jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Install UG and Claude CLI through internal registries
        env:
          PYTHONPATH: src
          JFROG_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: python3 scripts/macos-desktop-probe/install-dependencies.py
      - name: Configure and assert real Cowork inference
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: '"$UG_PROBE_PYTHON" scripts/macos-desktop-probe/probe.py'
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-cowork-probe-${{ matrix.os }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/macos-cowork-evidence/
