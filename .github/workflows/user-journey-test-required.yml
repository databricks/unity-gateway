name: User Journey Test Required

# This gate runs the default branch's script and reads PR patches through the GitHub
# API; it never executes code from the PR head. It runs automatically for in-repo PRs.
# Fork PRs get no secrets on `pull_request`, so an org member comments
# `/user-journey-check` to run it for them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  require-user-journey-test:
    name: User Journey Test Required
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '/user-journey-check' &&
          contains(fromJSON('["MEMBER", "OWNER"]'), github.event.comment.author_association))
      }}
    # Job-level so ordinary PR comments, which skip this job, never cancel a check.
    concurrency:
      group: user-journey-test-required-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the budget clock
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out the trusted gate from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/user-journey-required/check.py
            tests/AGENTS.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The PR checkout supplies only budget data; the gate continues to execute trusted code.
      - name: Read the PR's time budget
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: budget-source
          sparse-checkout: .github/ci-time-budgets.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mark setup done
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Require meaningful user-journey coverage
        id: gate
        # Temporarily advisory while runner access is blocked by the org IP allowlist.
        # Keep failures visible in logs without failing the required job check.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          DATABRICKS_HOST: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          USER_JOURNEY_JUDGE_MODEL: ${{ vars.UG_CI_USER_JOURNEY_JUDGE_MODEL }}
          TEST_POLICY_PATH: tests/AGENTS.md
          USER_JOURNEY_WAIVER_ADMINS: rohita5l lilly-luo
        run: |
          : "${USER_JOURNEY_JUDGE_MODEL:?Set the UG_CI_USER_JOURNEY_JUDGE_MODEL repository variable to a Responses-capable system.ai model}"
          python3 .github/scripts/user-journey-required/check.py

      # Comment-triggered runs are not attached to the PR, so report back on the evaluated commit.
      - name: Report the result on the fork PR
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.gate.outcome }}
          SHA: ${{ steps.gate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha=$SHA
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "User-journey check could not pin the evaluated commit; comment \`/user-journey-check\` to retry: $RUN_URL"
            exit 1
          fi
          state=$([ "$OUTCOME" = success ] && echo success || echo failure)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" \
            -f context="User Journey Test Required" -f description="User-journey check $OUTCOME" \
            -f target_url="$RUN_URL" >/dev/null
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "User-journey check $OUTCOME on ${sha:0:7}: $RUN_URL"
      - name: Check this job's time budget
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          export BUDGET_ENDED="$(date +%s)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('budget-source/.github/ci-time-budgets.json')
          if path.is_symlink() or path.parent.is_symlink():
              raise SystemExit('::error::The budget file must not be a symlink')
          budgets = json.loads(path.read_text(encoding='utf-8'))
          budget = budgets.get('user-journey-test-required', {}).get('require-user-journey-test', {}).get('User Journey Test Required')
          if budget is None:
              raise SystemExit('::error::No time budget for user-journey-test-required/require-user-journey-test/User Journey Test Required')
          start, run, end = (int(os.environ[name]) for name in
                             ('BUDGET_JOB_STARTED', 'BUDGET_RUN_STARTED', 'BUDGET_ENDED'))
          times = {'setup': run - start, 'run': end - run, 'total': end - start}
          if any(value < 0 for value in times.values()):
              raise SystemExit('::error::CI budget clock moved backwards')
          print(', '.join(f'{phase}: {elapsed}s / {budget[phase]}s' for phase, elapsed in times.items()))
          over = [f'{phase} {elapsed}s > {budget[phase]}s' for phase, elapsed in times.items()
                  if elapsed > budget[phase]]
          if over:
              raise SystemExit('::error::Over budget: ' + ', '.join(over))
          PY
