name: Publish skills action
on:
  pull_request:
    paths: ['actions/publish-skills/**', '.github/workflows/publish-skills-test.yml']
  push:
    branches: [main]
    paths: ['actions/publish-skills/**', '.github/workflows/publish-skills-test.yml']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security-gate:
    name: Security Gate
    permissions:
      actions: read
    uses: ./.github/workflows/security-gate.yml
  tests:
    name: Publisher tests (Python ${{ matrix.python }})
    env:
      BUDGET_WORKFLOW: publish-skills-test
      BUDGET_JOB_NAME: Publisher tests (Python ${{ matrix.python }})
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: actions/publish-skills
    steps:
      - &budget-start
        name: Start the budget clock
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env: &budget-secret-free
          UCODE_TEST_WORKSPACE: ''
          UCODE_TEST_SECOND_WORKSPACE: ''
          DATABRICKS_HOST: ''
          DATABRICKS_BEARER: ''
          DATABRICKS_SECOND_BEARER: ''
          DATABRICKS_CLIENT_ID: ''
          DATABRICKS_CLIENT_SECRET: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          CODEX_ACCESS_TOKEN: ''
          UG_CUJ1_WORKSPACE: ''
          UG_CUJ_SP_CLIENT_ID: ''
          UG_CUJ_SP_CLIENT_SECRET: ''
          UG_BUDGET_CUJ_SP_CLIENT_ID: ''
          UG_BUDGET_CUJ_SP_CLIENT_SECRET: ''
          DATABRICKS_BEARER_COMMAND: ''
        run: echo "BUDGET_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - &budget-setup-done
        name: Mark setup done
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env: *budget-secret-free
        run: echo "BUDGET_RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - run: python -m pytest tests -q
      - run: ruff check . && ruff format --check .
      - run: zizmor --offline action.yml ../../.github/workflows/publish-skills-test.yml
      - run: python -m pip_audit -r requirements.txt --strict --vulnerability-service osv --timeout 20
      - &budget-check
        name: Check this job's time budget
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          UCODE_TEST_WORKSPACE: ''
          UCODE_TEST_SECOND_WORKSPACE: ''
          DATABRICKS_HOST: ''
          DATABRICKS_BEARER: ''
          DATABRICKS_SECOND_BEARER: ''
          DATABRICKS_CLIENT_ID: ''
          DATABRICKS_CLIENT_SECRET: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          CODEX_ACCESS_TOKEN: ''
          UG_CUJ1_WORKSPACE: ''
          UG_CUJ_SP_CLIENT_ID: ''
          UG_CUJ_SP_CLIENT_SECRET: ''
          UG_BUDGET_CUJ_SP_CLIENT_ID: ''
          UG_BUDGET_CUJ_SP_CLIENT_SECRET: ''
          DATABRICKS_BEARER_COMMAND: ''
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- uv.lock pyproject.toml)
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" scripts/ci_time_budget.py --budgets .github/ci-time-budgets.json \
            --workflow "$BUDGET_WORKFLOW" --job "$GITHUB_JOB" --name "$BUDGET_JOB_NAME" \
            --started "$BUDGET_JOB_STARTED" --run-started "${BUDGET_RUN_STARTED:-$BUDGET_JOB_STARTED}" \
            --ended "$(date +%s)" --changed-files "$changed"

  smoke:
    name: Publisher composite action
    env:
      BUDGET_WORKFLOW: publish-skills-test
      BUDGET_JOB_NAME: Publisher composite action
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - *budget-setup-done
      - uses: ./actions/publish-skills # zizmor: ignore[self-repository] -- test checked-out action without credentials
        id: directory
        with:
          source-directory: actions/publish-skills/tests/fixture
          skills-directory: skills
          target-schema: acme.skills
          dry-run: 'true'
      - name: Verify directory result
        env:
          REPORT: ${{ steps.directory.outputs.report-file }}
        run: python -c 'import json,os; r=json.load(open(os.environ["REPORT"])); assert r["dry_run"] and r["results"][0]["target"] == "acme.skills.example" and r["results"][0]["status"] == "validated"'
      - uses: ./actions/publish-skills # zizmor: ignore[self-repository] -- test checked-out action without credentials
        id: mapping
        with:
          source-directory: actions/publish-skills/tests/fixture
          dry-run: 'true'
      - name: Verify mapping result
        env:
          REPORT: ${{ steps.mapping.outputs.report-file }}
        run: python -c 'import json,os; r=json.load(open(os.environ["REPORT"])); assert r["dry_run"] and len(r["results"]) == 1 and r["results"][0]["status"] == "validated"'
      - *budget-check
