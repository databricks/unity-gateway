# This branch-only probe reuses a workflow registered on main so it can be dispatched before merging.
name: Staging runner connectivity probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  staging-connectivity:
    name: Staging connectivity (${{ matrix.runner }})
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.runner }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        runner: [linux-ubuntu-latest, windows-server-latest]
    steps:
      - name: Check staging OAuth ingress without client credentials
        shell: python
        env:
          STAGING_WORKSPACE: ${{ secrets.UG_ANTHROPIC_MPS_WORKSPACE }}
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen

          workspace = os.environ["STAGING_WORKSPACE"].rstrip("/")
          parsed = urlsplit(workspace)
          if parsed.scheme != "https" or not (parsed.hostname or "").endswith(".staging.cloud.databricks.com"):
              raise SystemExit("Expected the configured staging workspace")
          request = Request(
              workspace + "/oidc/v1/token",
              data=urlencode({"grant_type": "client_credentials", "scope": "all-apis"}).encode(),
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          try:
              with urlopen(request, timeout=30) as response:
                  raise SystemExit(f"Unexpected unauthenticated OAuth response: HTTP {response.status}")
          except HTTPError as error:
              body = error.read(4096).decode("utf-8", errors="replace")
              print(f"Staging OAuth ingress: HTTP {error.code}")
              if error.code == 403 or "ingress/lockdown" in body:
                  raise SystemExit("Staging ingress blocks this managed runner")
              if error.code not in (400, 401):
                  raise SystemExit("Unexpected staging OAuth response")
              payload = json.loads(body)
              if payload.get("error") not in ("invalid_client", "invalid_request"):
                  raise SystemExit("Expected OAuth to reject the missing client credentials")
              print("PASS: staging OAuth is reachable; missing client credentials were rejected")
      - name: Check internal Python and npm package proxies
        shell: python
        run: |
          from urllib.request import urlopen

          urls = (
              "https://pypi-proxy.cloud.databricks.com/simple/pytest/",
              "https://npm-proxy.cloud.databricks.com/@anthropic-ai%2fclaude-code/2.1.290",
              "https://npm-proxy.cloud.databricks.com/@github%2fcopilot/1.0.91",
          )
          for url in urls:
              with urlopen(url, timeout=30) as response:
                  print(f"Internal package proxy: HTTP {response.status} {url}")
