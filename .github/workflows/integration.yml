name: Integration

on:
  workflow_call:
    inputs:
      mode:
        description: Run required, advisory, or all integration jobs
        type: string
        default: all
      ref:
        description: Commit to test; fork-integration.yml passes the PR head pinned by /integration-test
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ug_version:
        description: Exact ug release, or checkout
        default: checkout
        required: true
      entry_point:
        description: Console command (older releases may only have ucode)
        type: choice
        options: [ug, ucode]
        default: ug
      claude_version:
        description: Exact Claude Code version
        default: 2.1.290
        required: true
      codex_version:
        description: Exact Codex version
        default: 0.156.0
        required: true
      opencode_version:
        description: Exact OpenCode version (non-blocking lane)
        default: 1.18.31
        required: true
      copilot_version:
        description: Exact GitHub Copilot CLI version (non-blocking lane)
        default: 1.0.91
        required: true
      antigravity_build:
        description: Exact Antigravity CLI build, <version>-<build id> (Linux lane)
        default: 1.5.4-5037094733742080
        required: true
      vscode_version:
        description: Exact VS Code version, which pins its bundled Copilot Chat (non-blocking Linux and Windows lane)
        default: 1.147.0
        required: true
      dependency:
        description: Optional exact dependency for reproduction (e.g. tomlkit==0.14.0)
        default: ''
        required: false
      default_index:
        description: Python package index containing the requested ug version
        default: https://pypi.org/simple
        required: true

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  EXPECTED_WORKSPACE: https://eng-ml-inference-team-us-east-1.cloud.databricks.com
  UG_VERSION: ${{ inputs.ug_version || 'checkout' }}
  ENTRY_POINT: ${{ inputs.entry_point || 'ug' }}
  CLAUDE_VERSION: ${{ inputs.claude_version || '2.1.290' }}
  CODEX_VERSION: ${{ inputs.codex_version || '0.156.0' }}
  OPENCODE_VERSION: ${{ inputs.opencode_version || '1.18.31' }}
  COPILOT_VERSION: ${{ inputs.copilot_version || '1.0.91' }}
  ANTIGRAVITY_BUILD: ${{ inputs.antigravity_build || '1.5.4-5037094733742080' }}
  VSCODE_VERSION: ${{ inputs.vscode_version || '1.147.0' }}
  PACKAGE_INDEX: ${{ inputs.default_index || 'https://pypi.org/simple' }}
  CLAUDE_DESKTOP_WINDOWS_URL: https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix
  CLAUDE_DESKTOP_WINDOWS_SHA256: D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9
  CLAUDE_DESKTOP_MACOS_URL: https://downloads.claude.ai/releases/darwin/universal/4.23118.0/Claude-8175c354eda704cea00fdeddfa69cea329dd321a.zip
  CLAUDE_DESKTOP_MACOS_SHA256: 5b8feee3da048e26bbb29a5d601e97034f674ac3b76f7d0237751c46d6034b23
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  installation:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'Installation tests (runs in Integration)' || 'Installation tests' }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Installation tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - &budget-start
        name: Start the budget clock
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env: &budget-secret-free
          UCODE_TEST_WORKSPACE: ''
          UCODE_TEST_SECOND_WORKSPACE: ''
          DATABRICKS_HOST: ''
          DATABRICKS_BEARER: ''
          DATABRICKS_SECOND_BEARER: ''
          DATABRICKS_CLIENT_ID: ''
          DATABRICKS_CLIENT_SECRET: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          CODEX_ACCESS_TOKEN: ''
          UG_CUJ1_WORKSPACE: ''
          UG_CUJ_SP_CLIENT_ID: ''
          UG_CUJ_SP_CLIENT_SECRET: ''
          UG_BUDGET_CUJ_SP_CLIENT_ID: ''
          UG_BUDGET_CUJ_SP_CLIENT_SECRET: ''
          DATABRICKS_BEARER_COMMAND: ''
          UG_COWORK_PAT: ''
        run: echo "BUDGET_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - &budget-setup-done
        name: Mark setup done
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env: *budget-secret-free
        run: echo "BUDGET_RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Test a fresh installed package without credentials
        run: |
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" \
            --default-index "$PACKAGE_INDEX" --installation-only --output "$RUNNER_TEMP/ug-integration"
      - name: Upload installation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-installation
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      - &budget-check
        name: Check this job's time budget
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          UCODE_TEST_WORKSPACE: ''
          UCODE_TEST_SECOND_WORKSPACE: ''
          DATABRICKS_HOST: ''
          DATABRICKS_BEARER: ''
          DATABRICKS_SECOND_BEARER: ''
          DATABRICKS_CLIENT_ID: ''
          DATABRICKS_CLIENT_SECRET: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          CODEX_ACCESS_TOKEN: ''
          UG_CUJ1_WORKSPACE: ''
          UG_CUJ_SP_CLIENT_ID: ''
          UG_CUJ_SP_CLIENT_SECRET: ''
          UG_BUDGET_CUJ_SP_CLIENT_ID: ''
          UG_BUDGET_CUJ_SP_CLIENT_SECRET: ''
          DATABRICKS_BEARER_COMMAND: ''
          UG_COWORK_PAT: ''
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- uv.lock pyproject.toml)
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" scripts/ci_time_budget.py --budgets .github/ci-time-budgets.json \
            --workflow "$BUDGET_WORKFLOW" --job "$GITHUB_JOB" --name "$BUDGET_JOB_NAME" \
            --started "$BUDGET_JOB_STARTED" --run-started "${BUDGET_RUN_STARTED:-$BUDGET_JOB_STARTED}" \
            --ended "$(date +%s)" --changed-files "$changed"

  installation-windows:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'Windows installation tests (runs in Integration)' || 'Windows installation tests' }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Windows installation tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - *budget-setup-done
      - name: Test a fresh installed package without workspace credentials
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ug-integration"
          $runnerArgs = @(
            "--python", "3.12",
            "--ug-version", $env:UG_VERSION,
            "--entry-point", $env:ENTRY_POINT,
            "--claude-version", $env:CLAUDE_VERSION,
            "--default-index", $env:PACKAGE_INDEX,
            "--installation-only",
            "--output", $output
          )
          uv run --no-project --python 3.12 python scripts/run_integration.py @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-installation-windows
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      - *budget-check

  cowork-inference-windows:
    name: ${{ inputs.mode == 'advisory' && 'Cowork desktop tasks · Windows (runs in Integration)' || format('Cowork desktop tasks · Windows · {0}', matrix.source.name) }}
    runs-on: windows-latest
    if: ${{ inputs.mode != 'advisory' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source:
          - id: databricks
            name: Databricks Hosted
            provider: ''
            model: system.ai.claude-haiku-4-5
            relay: false
          - id: anthropic-relay
            name: Anthropic relay MPS
            provider: main.ucode.ci_e2e_anthropic_relay_mps
            model: claude-haiku-4-5-20251001
            relay: true
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Cowork desktop tasks · Windows · ${{ matrix.source.name }}
      PYTHONUTF8: 1
      UG_COWORK_PROVIDER: ${{ matrix.source.provider }}
      UG_COWORK_MODEL: ${{ matrix.source.model }}
      UG_COWORK_RELAY: ${{ matrix.source.relay }}
      # configure selects this lane's MCP service (task-fixture.json mcpService).
      UG_COWORK_MCP: true
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Cowork test scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/cowork-inference/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & ./scripts/cowork-inference/test-diagnostics.ps1
          & ./scripts/cowork-inference/test-prepare-task.ps1
      # The pinned installer is cached by its verified SHA256; the script still checks it.
      - name: Cache the pinned Claude installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/Claude.msix
          key: claude-desktop-windows-${{ env.CLAUDE_DESKTOP_WINDOWS_SHA256 }}
      - name: Download and verify the approved Claude installer
        shell: pwsh
        run: ./scripts/cowork-inference/download-desktop.ps1
      - name: Install UG checkout and pinned Claude CLI
        shell: pwsh
        run: ./scripts/cowork-inference/install-dependencies.ps1
      - *budget-setup-done
      - name: Configure Desktop with existing CI credentials
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        id: cowork-inference
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork file read
        timeout-minutes: 10
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability file -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/file"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability skill -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/skill"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork MCP web search
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability mcp -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/mcp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Revoke the Desktop PAT
        if: always()
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'desktop-ug-runtime/Scripts/python.exe'
          if (Test-Path -LiteralPath $python) {
            & $python scripts/cowork-inference/desktop-pat.py revoke --state "$env:RUNNER_TEMP/cowork-pat-id"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-${{ matrix.source.id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
            ${{ runner.temp }}/cowork-inference/file/
            ${{ runner.temp }}/cowork-inference/skill/
            ${{ runner.temp }}/cowork-inference/mcp/
          if-no-files-found: warn
      - *budget-check

  cowork-inference-macos:
    name: ${{ inputs.mode == 'advisory' && 'Cowork desktop tasks · macOS (runs in Integration)' || format('Cowork desktop tasks · macOS · {0}', matrix.source.name) }}
    runs-on: macos-15-intel
    if: ${{ inputs.mode != 'advisory' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        source:
          - id: databricks
            name: Databricks Hosted
            provider: ''
            model: system.ai.claude-haiku-4-5
            relay: false
          - id: anthropic
            name: Anthropic MPS
            provider: main.ucode.ci_e2e_anthropic_nonrelay_mps
            model: claude-haiku-4-5-20251001
            relay: false
          - id: anthropic-relay
            name: Anthropic relay MPS
            provider: main.ucode.ci_e2e_anthropic_relay_mps
            model: claude-haiku-4-5-20251001
            relay: true
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Cowork desktop tasks · macOS · ${{ matrix.source.name }}
      UG_COWORK_PROVIDER: ${{ matrix.source.provider }}
      UG_COWORK_MODEL: ${{ matrix.source.model }}
      UG_COWORK_RELAY: ${{ matrix.source.relay }}
      # configure selects this lane's MCP service (task-fixture.json mcpService).
      UG_COWORK_MCP: true
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      # The pinned archive is cached by its verified SHA256; the script still checks it.
      - name: Cache the pinned Claude app
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/Claude.zip
          key: claude-desktop-macos-${{ env.CLAUDE_DESKTOP_MACOS_SHA256 }}
      - name: Install and verify Claude Desktop
        run: bash scripts/cowork-inference/macos/install-desktop.sh
      - name: Install UG checkout and pinned Claude CLI
        run: bash scripts/cowork-inference/macos/install-dependencies.sh
      - *budget-setup-done
      - name: Configure and assert Cowork inference through macOS Accessibility
        id: cowork-inference
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py'
      - name: Assert Cowork file read
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability file'
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability skill'
      - name: Assert Cowork MCP web search
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability mcp'
      - name: Stop desktop processes
        if: always()
        run: |
          pkill -f '/Applications/Claude.app/Contents/' || test "$?" = 1
          pkill -x Terminal || test "$?" = 1
      - name: Revoke the Desktop PAT
        if: always()
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          if [ -n "${UG_COWORK_PYTHON:-}" ]; then
            "$UG_COWORK_PYTHON" scripts/cowork-inference/desktop-pat.py revoke --state "$RUNNER_TEMP/cowork-pat-id"
          fi
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-macos-${{ matrix.source.id }}
          retention-days: 3
          path: ${{ runner.temp }}/macos-cowork-evidence/
          if-no-files-found: warn
      - *budget-check

  workspace:
    name: Workspace validation
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Workspace validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - *budget-setup-done
      - name: Verify the existing e2e workspace and credential are configured
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          python3 - <<'PY'
          import os
          expected = os.environ["EXPECTED_WORKSPACE"].rstrip("/")
          actual = os.environ["UCODE_TEST_WORKSPACE"].strip().rstrip("/")
          if actual != expected:
              raise SystemExit("UCODE_TEST_WORKSPACE does not match the expected CI workspace.")
          if not os.environ["DATABRICKS_BEARER"].strip():
              raise SystemExit("The existing e2e DATABRICKS_BEARER secret is missing.")
          print("CI workspace matches; the existing e2e credential is present.")
          PY
      - *budget-check

  smoke:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'Smoke journeys (runs in Integration)' || format('Smoke journeys · {0} · {1}', matrix.agent == 'claude' && 'Claude' || 'Codex', matrix.os == 'windows-latest' && 'Windows' || 'Linux') }}
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude, codex]
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Smoke journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: live and smoke and ${{ matrix.agent }} and not soft_fail
      ARTIFACT_NAME: integration-smoke-${{ matrix.agent }}-${{ matrix.os }}
    steps: &live-steps
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Restore pinned Node toolcache
        id: node-toolcache
        if: ${{ env.UG_CACHE_PINNED_NODE == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/node/22.19.0
          key: node-toolcache-${{ runner.os }}-${{ runner.arch }}-22.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - name: Save pinned Node toolcache
        if: ${{ env.UG_CACHE_PINNED_NODE == 'true' && steps.node-toolcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/node/22.19.0
          key: node-toolcache-${{ runner.os }}-${{ runner.arch }}-22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - &windows-cli-download-retries
        name: Bound Windows Databricks CLI download retries
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $curlHome = Join-Path $env:RUNNER_TEMP "databricks-cli-curl"
          New-Item -ItemType Directory -Force -Path $curlHome | Out-Null
          @(
            "retry = 3"
            "retry-all-errors"
            "retry-max-time = 60"
            "connect-timeout = 20"
            "max-time = 120"
          ) | Set-Content -Path (Join-Path $curlHome ".curlrc") -Encoding ascii
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        env:
          CURL_HOME: ${{ runner.temp }}/databricks-cli-curl
        with:
          version: 1.17.0
      - name: Expose the Databricks CLI on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/.bin/databricks.exe"
          cygpath -w "$RUNNER_TEMP/.bin" >> "$GITHUB_PATH"
      - name: Install a virtual display for VS Code
        if: ${{ env.AGENT == 'vscode' && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - *budget-setup-done
      - name: Run the selected live cases against the e2e workspace
        shell: bash
        run: |
          case "$AGENT" in
            claude) args=(--claude-version "$CLAUDE_VERSION") ;;
            codex) args=(--codex-version "$CODEX_VERSION") ;;
            opencode) args=(--opencode-version "$OPENCODE_VERSION") ;;
            copilot) args=(--copilot-version "$COPILOT_VERSION") ;;
            antigravity) args=(--antigravity-build "$ANTIGRAVITY_BUILD") ;;
            vscode) args=(--copilot-version "$COPILOT_VERSION" --vscode-version "$VSCODE_VERSION") ;;
          esac
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          if [[ -n "$LIVE_SHARD" ]]; then
            args+=(--test-shard "$LIVE_SHARD" --shard-lane "$LIVE_SHARD_LANE")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --npm-registry "$NPM_REGISTRY" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Record staging model usage
        if: ${{ !cancelled() && env.UG_MODEL_LEDGER == 'staging' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ug-integration"
          uv run --no-project --python 3.12 python tests/integration/utils/traffic_ledger.py \
            "$RUNNER_TEMP/ug-integration" --lane staging
      - name: Inspect staging provider rate limits
        if: ${{ !cancelled() && env.UG_COWORK_DESKTOP == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          uv run --no-project --python 3.12 python scripts/managed_quota_diagnostics.py --provider-only \
            > "$RUNNER_TEMP/ug-integration/staging-provider-quota.json"
      - name: Upload live test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      # Claude Desktop runs only in the Windows Claude anthropic-mps lane; see scripts/cowork-inference/README.md.
      - name: Cache the pinned Claude installer
        if: ${{ !cancelled() && env.UG_COWORK_DESKTOP == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/Claude.msix
          key: claude-desktop-windows-${{ env.CLAUDE_DESKTOP_WINDOWS_SHA256 }}
      - name: Install Claude Desktop
        id: desktop-install
        if: ${{ !cancelled() && env.UG_COWORK_DESKTOP == 'true' }}
        shell: pwsh
        run: ./scripts/cowork-inference/download-desktop.ps1
      - name: Install the Desktop UG runtime and Claude CLI
        id: desktop-dependencies
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        shell: pwsh
        env:
          UG_COWORK_PACKAGE_INDEX: ${{ env.PACKAGE_INDEX }}
          UG_COWORK_NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
        run: |
          ./scripts/cowork-inference/install-dependencies.ps1
          # Desktop's credential helper reruns this, so tokens outlive the one-hour M2M token.
          $python = Join-Path $env:RUNNER_TEMP 'desktop-ug-runtime/Scripts/python.exe'
          $mint = Join-Path $env:GITHUB_WORKSPACE 'scripts/cowork-inference/bearer-token.py'
          "DATABRICKS_BEARER_COMMAND=`"$python`" `"$mint`"" | Add-Content $env:GITHUB_ENV
      - name: Configure Desktop for the staging Anthropic MPS
        id: desktop-configure
        if: ${{ !cancelled() && steps.desktop-dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        id: desktop-inference
        if: ${{ !cancelled() && steps.desktop-configure.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork file read
        if: ${{ !cancelled() && steps.desktop-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability file -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/file"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.desktop-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability skill -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/skill"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork MCP web search
        if: ${{ !cancelled() && steps.desktop-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability mcp -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/mcp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record staging Desktop model usage
        if: ${{ !cancelled() && env.UG_COWORK_DESKTOP == 'true' && steps.desktop-install.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          uv run --no-project --python 3.12 python tests/integration/utils/traffic_ledger.py \
            "$RUNNER_TEMP/cowork-inference" --lane staging-desktop \
            --sessions-root "$LOCALAPPDATA/Claude-3p/local-agent-mode-sessions" \
            --since-file "$RUNNER_TEMP/cowork-inference/configuration.json" --model "$UG_COWORK_MODEL"
      - name: Revoke the Desktop PAT
        if: ${{ always() && steps.desktop-dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'desktop-ug-runtime/Scripts/python.exe'
          & $python scripts/cowork-inference/desktop-pat.py revoke --state "$env:RUNNER_TEMP/cowork-pat-id"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Cowork evidence
        if: ${{ !cancelled() && steps.desktop-install.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-anthropic
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
            ${{ runner.temp }}/cowork-inference/file/
            ${{ runner.temp }}/cowork-inference/skill/
            ${{ runner.temp }}/cowork-inference/mcp/
          if-no-files-found: warn
      - *budget-check

  anthropic-mps:
    name: Anthropic MPS - Staging workspace · ${{ matrix.agent == 'claude' && 'Claude' || 'Copilot' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}${{ matrix.agent == 'copilot' && ' (non-blocking)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: ${{ matrix.agent == 'copilot' }}
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.os == 'windows-latest' && 'windows-server-latest' || 'linux-ubuntu-latest' }}
    # The Windows Claude lane also runs the Cowork Desktop tasks.
    timeout-minutes: ${{ matrix.agent == 'copilot' && 30 || matrix.os == 'windows-latest' && 85 || 40 }}
    strategy:
      fail-fast: false
      # The Windows Claude journeys split across shards balanced from recorded case times
      # (tests/live_shard.py); the Cowork Desktop steps run once, on the first shard.
      # The blocking caller runs the Claude legs (the Windows ones as three shards balanced
      # from recorded case times, tests/live_shard.py); the advisory caller runs the Copilot
      # legs; a dispatch without a mode runs both.
      matrix:
        include: ${{ fromJSON(inputs.mode == 'required' && '[{"os":"ubuntu-22.04","agent":"claude"},{"os":"windows-latest","agent":"claude","shard":"1/3","shard_index":1},{"os":"windows-latest","agent":"claude","shard":"2/3","shard_index":2},{"os":"windows-latest","agent":"claude","shard":"3/3","shard_index":3}]' || inputs.mode == 'advisory' && '[{"os":"ubuntu-22.04","agent":"copilot"},{"os":"windows-latest","agent":"copilot"}]' || '[{"os":"ubuntu-22.04","agent":"claude"},{"os":"windows-latest","agent":"claude","shard":"1/3","shard_index":1},{"os":"windows-latest","agent":"claude","shard":"2/3","shard_index":2},{"os":"windows-latest","agent":"claude","shard":"3/3","shard_index":3},{"os":"ubuntu-22.04","agent":"copilot"},{"os":"windows-latest","agent":"copilot"}]') }}

    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Anthropic MPS - Staging workspace · ${{ matrix.agent == 'claude' && 'Claude' || 'Copilot' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}${{ matrix.agent == 'copilot' && ' (non-blocking)' || '' }}
      PACKAGE_INDEX: https://pypi-proxy.cloud.databricks.com/simple
      NPM_REGISTRY: https://npm-proxy.cloud.databricks.com
      UCODE_TEST_WORKSPACE: https://dbc-1bb9e8f5-bf3a.staging.cloud.databricks.com
      DATABRICKS_CLIENT_ID: 39206fba-a07b-4954-b8f9-4a1c9c069bba
      DATABRICKS_CLIENT_SECRET: ${{ secrets.UG_ANTHROPIC_MPS_CLIENT_SECRET }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: anthropic_mps and ${{ matrix.agent }}
      UG_MODEL_LEDGER: ${{ matrix.agent == 'claude' && 'staging' || '' }}
      ARTIFACT_NAME: integration-anthropic-mps-${{ matrix.agent }}-${{ matrix.os }}${{ matrix.shard && '-shard' || '' }}${{ matrix.shard_index || '' }}
      # Desktop jobs skip merge-group runs, like the other Cowork lanes.
      UG_COWORK_DESKTOP: ${{ github.event_name != 'merge_group' && matrix.os == 'windows-latest' && matrix.agent == 'claude' && matrix.shard_index == 1 }}
      UG_COWORK_PROVIDER: main.ucode.dont_delete_ci_company_anthropic_mps
      UG_COWORK_MODEL: claude-haiku-4-5-20251001
      UG_COWORK_RELAY: false
      UG_COWORK_MCP: true
      UG_CACHE_PINNED_NODE: ${{ inputs.ref == '' && matrix.os == 'windows-latest' && matrix.agent == 'claude' }}
      LIVE_SHARD: ${{ matrix.shard || '' }}
      LIVE_SHARD_LANE: anthropic-mps-claude
    steps: *live-steps

  headless-windows:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'Windows headless journey · Claude (runs in Integration)' || 'Windows headless journey · Claude' }}
    needs: workspace
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Windows headless journey · Claude
      DEPENDENCY: ${{ inputs.dependency }}
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - *windows-cli-download-retries
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        env:
          CURL_HOME: ${{ runner.temp }}/databricks-cli-curl
        with:
          version: 1.17.0
      - name: Expose the Databricks CLI to native PowerShell
        shell: pwsh
        run: |
          $databricks = Join-Path $env:RUNNER_TEMP ".bin/databricks.exe"
          if (-not (Test-Path -LiteralPath $databricks -PathType Leaf)) {
            throw "setup-cli did not install the expected executable: $databricks"
          }
          Split-Path -Parent $databricks |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $databricks version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - *budget-setup-done
      - name: Configure and complete a real headless gateway task
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ug-integration"
          $runnerArgs = @(
            "--python", "3.12",
            "--ug-version", $env:UG_VERSION,
            "--entry-point", $env:ENTRY_POINT,
            "--claude-version", $env:CLAUDE_VERSION,
            "--default-index", $env:PACKAGE_INDEX,
            "--headless-only",
            "--output", $output
          )
          if ($env:DEPENDENCY) { $runnerArgs += @("--dependency", $env:DEPENDENCY) }
          uv run --no-project --python 3.12 python scripts/run_integration.py @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows headless evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-headless-windows-claude
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      - *budget-check

  full:
    name: ${{ inputs.mode == 'advisory' && 'Full journeys (runs in Integration)' || format('Full journeys · {0} · {1}{2}', matrix.agent == 'claude' && 'Claude' || 'Codex', matrix.os == 'windows-latest' && 'Windows' || 'Linux', matrix.smart_routing && ' · Smart routing' || '') }}
    if: ${{ inputs.mode != 'advisory' && !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    runs-on: ${{ matrix.os }}
    # The runner enforces its own 3600s pytest deadline; keep the job above it
    # so a slow run fails through the runner's report instead of a job kill.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      # Native Codex routing needs a newer binary; other journeys retain the baseline.
      # Every leg starts at once: the Claude Windows ones are shards balanced from recorded case
      # times (tests/live_shard.py), so no lane waits on another (#1829 removed the waits).
      matrix:
        include:
          - os: ubuntu-22.04
            agent: codex
          - os: windows-latest
            agent: codex
          - os: ubuntu-22.04
            agent: claude
          - os: windows-latest
            agent: claude
            shard: "1/4"
            shard_index: 1
          - os: windows-latest
            agent: claude
            shard: "2/4"
            shard_index: 2
          - os: windows-latest
            agent: claude
            shard: "3/4"
            shard_index: 3
          - os: windows-latest
            agent: claude
            shard: "4/4"
            shard_index: 4
          - os: ubuntu-22.04
            agent: codex
            smart_routing: true
          - os: windows-latest
            agent: codex
            smart_routing: true
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Full journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}${{ matrix.smart_routing && ' · Smart routing' || '' }}
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      CODEX_VERSION: ${{ matrix.smart_routing && '0.171.0' || inputs.codex_version || '0.156.0' }}
      # Smoke cases run separately on this OS; don't repeat them here.
      TEST_MARKER: live and ${{ matrix.agent }} and not soft_fail and not smoke and not anthropic_mps and not codex_relay and ${{ matrix.smart_routing && 'codex_smart_routing' || 'not codex_smart_routing' }}
      ARTIFACT_NAME: integration-full-${{ matrix.agent }}-${{ matrix.os }}${{ matrix.smart_routing && '-smart-routing' || '' }}${{ matrix.shard && '-shard' || '' }}${{ matrix.shard_index || '' }}
      LIVE_SHARD: ${{ matrix.shard || '' }}
      LIVE_SHARD_LANE: full-claude
    steps: *live-steps

  codex-relay:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'Codex relay login and inference (runs in Integration)' || 'Codex relay login and inference' }}
    needs: workspace
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 20
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Codex relay login and inference
      PACKAGE_INDEX: https://pypi-proxy.cloud.databricks.com/simple
      NPM_REGISTRY: https://npm-proxy.cloud.databricks.com
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_OAUTH_TOKEN }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: codex
      TEST_MARKER: live and codex and codex_relay
      ARTIFACT_NAME: integration-codex-relay
    steps: *live-steps

  # See tests/integration/README.md#soft-fail-tests for supported cases and restoration criteria.
  soft-fail:
    name: ${{ inputs.mode == 'required' && 'Soft-fail journeys (runs in Integration advisory)' || format('Soft-fail journeys · {0} · {1} (non-blocking)', matrix.agent, matrix.os == 'windows-latest' && 'Windows' || 'Linux') }}
    if: ${{ inputs.mode != 'required' && !cancelled() && needs.workspace.result == 'success' }}
    needs: [workspace, full, managed]
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude]
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Soft-fail journeys · ${{ matrix.agent }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: live and ${{ matrix.agent }} and soft_fail
      ARTIFACT_NAME: integration-soft-fail-${{ matrix.agent }}-${{ matrix.os }}
    steps: *live-steps

  # Non-blocking: continue-on-error and absent from the cujs `needs`, so a flaky OpenCode
  # leg cannot block merges. Add it to cujs once the lane is stable.
  opencode:
    name: ${{ inputs.mode == 'required' && 'Full journeys · OpenCode (runs in Integration advisory)' || format('Full journeys · OpenCode · {0} (non-blocking)', matrix.os == 'windows-latest' && 'Windows' || 'Linux') }}
    if: ${{ inputs.mode != 'required' && !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Full journeys · OpenCode · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: opencode
      TEST_MARKER: live and opencode
      ARTIFACT_NAME: integration-full-opencode-${{ matrix.os }}
    steps: *live-steps

  # Non-blocking pending stabilization, like OpenCode: continue-on-error and absent from the
  # cujs `needs`.
  copilot:
    name: ${{ inputs.mode == 'required' && 'Full journeys · Copilot (runs in Integration advisory)' || format('Full journeys · Copilot · {0} (non-blocking)', matrix.os == 'windows-latest' && 'Windows' || 'Linux') }}
    if: ${{ inputs.mode != 'required' && !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Full journeys · Copilot · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: copilot
      TEST_MARKER: live and copilot and not anthropic_mps
      ARTIFACT_NAME: integration-full-copilot-${{ matrix.os }}
    steps: *live-steps

  # Blocking: part of the cujs gate. Linux only: Antigravity CLI's gateway mode supports macOS
  # and Linux, and ug installs no Windows build.
  antigravity:
    name: ${{ inputs.mode == 'advisory' && 'Full journeys · Antigravity · Linux (runs in Integration)' || 'Full journeys · Antigravity · Linux' }}
    if: ${{ inputs.mode != 'advisory' && !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Full journeys · Antigravity · Linux
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: antigravity
      TEST_MARKER: live and antigravity
      ARTIFACT_NAME: integration-full-antigravity-ubuntu-22.04
    steps: *live-steps

  # Non-blocking pending stabilization, like Copilot: continue-on-error and absent from the cujs
  # `needs`. On Linux the tests drive the VS Code window on a private Xvfb display.
  vscode:
    name: ${{ inputs.mode == 'required' && 'Full journeys · VS Code Copilot Chat (runs in Integration advisory)' || format('Full journeys · VS Code Copilot Chat · {0} (non-blocking)', matrix.os == 'windows-latest' && 'Windows' || 'Linux') }}
    if: ${{ inputs.mode != 'required' && !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Full journeys · VS Code Copilot Chat · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: vscode
      TEST_MARKER: live and vscode
      ARTIFACT_NAME: integration-full-vscode-${{ matrix.os }}
    steps: *live-steps

  # Non-blocking pending stabilization: continue-on-error and absent from the cujs `needs`.
  # Runs on the managed e2e workspace with an injected config that enables Claude/Codex but not
  # OpenCode (a service principal authenticates it, like the `managed` lane).
  managed-opencode:
    name: ${{ inputs.mode == 'required' && 'Managed OpenCode self-managed (runs in Integration advisory)' || 'Managed OpenCode self-managed (non-blocking)' }}
    if: ${{ inputs.mode != 'required' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Managed OpenCode self-managed (non-blocking)
      UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
      DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
      DEPENDENCY: ${{ inputs.dependency }}
      TEST_MARKER: managed_fixture and opencode
      ARTIFACT_NAME: integration-managed-opencode
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - *budget-setup-done
      - name: Run the self-managed OpenCode journey against the managed workspace
        shell: bash
        run: |
          # Bare `ug configure` applies the admin's Claude/Codex agents, and the journey launches
          # OpenCode, so all three CLIs must be installed.
          args=(--claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" --opencode-version "$OPENCODE_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Upload managed OpenCode evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

      - *budget-check

  # This general managed lane is Linux-only; anthropic-mps covers Claude MPS managed
  # settings on Windows too. Dedicated CUJs require POSIX PTYs.

  managed:
    name: ${{ inputs.mode == 'advisory' && 'Managed config (runs in Integration)' || format('Managed config · {0}', matrix.agent == 'claude' && 'Claude' || 'Codex') }}
    if: ${{ inputs.mode != 'advisory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Managed config · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      CODEX_VERSION: ${{ inputs.codex_version || '0.156.0' }}
      ARTIFACT_NAME: integration-managed-${{ matrix.agent }}
      UG_MODEL_LEDGER: basic-${{ matrix.agent }}
      TEST_MARKER: (managed_fixture or workspace_switch) and ${{ matrix.agent }} and not soft_fail and not anthropic_mps and not codex_smart_routing
    steps: &managed-steps
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Cache Codex 0.156.0
        if: ${{ env.UG_MODEL_LEDGER == 'smart' }}
        id: old-codex-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/codex-0.156.0
          key: codex-old-${{ runner.os }}-${{ runner.arch }}-node-22.19.0-0.156.0
      - name: Install Codex 0.156.0
        if: ${{ env.UG_MODEL_LEDGER == 'smart' && steps.old-codex-cache.outputs.cache-hit != 'true' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-0.156.0" --save-exact --no-audit --no-fund \
            --registry "$NPM_REGISTRY" '@openai/codex@0.156.0'
      - name: Verify isolated Codex 0.156.0
        if: ${{ env.UG_MODEL_LEDGER == 'smart' }}
        run: |
          old_bin="$RUNNER_TEMP/codex-0.156.0/node_modules/.bin"
          "$old_bin/codex" --version | grep -Eq '(^|[^0-9.])0\.156\.0([^0-9.]|$)'
          echo "UG_INTEGRATION_OLD_CODEX_BIN_DIR=$old_bin" >> "$GITHUB_ENV"
      - *budget-setup-done
      - name: Run the managed cases against the managed e2e workspace
        shell: bash
        env:
          # The managed workspace authenticates as a service principal; the runner mints a
          # short-lived token from these standard Databricks client-credential variables.
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
          UCODE_TEST_SECOND_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_SECOND_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          # A managed config enables both agents and `ug configure` applies it to every enabled
          # agent, so both CLIs must be installed even though this lane asserts only one agent.
          args=(--claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Build and validate observed model ledger
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --python 3.12 python tests/integration/utils/traffic_ledger.py \
            "$RUNNER_TEMP/ug-integration" --lane "$UG_MODEL_LEDGER"
      - name: Upload managed test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      - *budget-check

  managed-smart:
    name: ${{ inputs.mode == 'advisory' && 'Managed config · Codex · Smart routing (runs in Integration)' || 'Managed config · Codex · Smart routing' }}
    if: ${{ !cancelled() && inputs.mode != 'advisory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Managed config · Codex · Smart routing
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: codex
      CODEX_VERSION: '0.171.0'
      ARTIFACT_NAME: integration-managed-codex-smart-routing
      UG_MODEL_LEDGER: smart
      TEST_MARKER: (managed_fixture or workspace_switch) and codex and not soft_fail and not anthropic_mps and codex_smart_routing
    steps: *managed-steps

  dedicated-cuj-plan:
    name: ${{ inputs.mode == 'advisory' && 'Plan E2E CUJs (runs in Integration)' || 'Plan E2E CUJs' }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Plan E2E CUJs
    if: ${{ inputs.mode != 'advisory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cujs: ${{ steps.discover.outputs.cujs }}
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - *budget-setup-done
      - name: Discover every E2E CUJ file
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          # A CUJ file slow enough to dominate `e2e` (tests/live_test_times.json) runs as that
          # many shards; every other file keeps today's single runner.
          cujs=$(for path in tests/e2e_cuj/test_*.py; do
            name=$(sed -n 's/^CUJ_NAME = "\(.*\)"$/\1/p' "$path")
            [ -n "$name" ] || { echo "$path must define CUJ_NAME" >&2; exit 1; }
            shards=$(jq -r --arg test "${path##*/}" '.["cuj-"+$test].Linux.shards // 1' tests/live_test_times.json)
            for index in $(seq 1 "$shards"); do
              jq -nc --arg test "${path##*/}" --arg name "$name" \
                --argjson shards "$shards" --argjson index "$index" '
                {test: $test, name: $name} +
                (if $shards > 1 then {shard: "\($index)/\($shards)", shard_index: $index} else {} end)'
            done
          done | jq -sc .)
          echo "cujs=$cujs" >> "$GITHUB_OUTPUT"
      - *budget-check

  dedicated-cuj:
    if: ${{ inputs.mode != 'advisory' }}
    name: ${{ inputs.mode == 'advisory' && 'E2E CUJs (runs in Integration)' || format('E2E CUJs · {0}', matrix.name) }}
    # CUJ definitions: https://docs.google.com/document/d/1WKd1fdWD0Y4tAV1H9Si-SGx2UZFL7iZ2S3HtBjidmS0/edit?usp=drive_web&ouid=117446678071138243519
    # One runner per file: CUJs own separate workspaces but share machine-wide /etc agent settings.
    needs: dedicated-cuj-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dedicated-cuj-plan.outputs.cujs) }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: E2E CUJs · ${{ matrix.name }}
      CODEX_VERSION: ${{ (matrix.test == 'test_cuj4_smart_routing.py' || matrix.test == 'test_cuj7_model_discovery.py') && '0.171.0' || inputs.codex_version || '0.156.0' }}
      UV_INDEX_URL: https://pypi.org/simple
      # Every CUJ runner installs from PyPI at once; ride out slow responses instead of failing a shard.
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "6"
      UG_CUJ1_WORKSPACE: ${{ secrets.UG_CUJ1_WORKSPACE }}
      UG_CUJ_SP_CLIENT_ID: ${{ secrets.UG_CUJ_SP_CLIENT_ID }}
      UG_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_CUJ_SP_CLIENT_SECRET }}
      UG_BUDGET_CUJ_SP_CLIENT_ID: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_ID }}
      UG_BUDGET_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_SECRET }}
      # Sharded CUJ files: the conftest keeps only this shard's cases and writes the report.
      UG_LIVE_SHARD: ${{ matrix.shard || '' }}
      UG_LIVE_SHARD_LANE: ${{ matrix.shard && format('cuj-{0}', matrix.test) || '' }}
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Install ug and agent CLIs
        run: |
          uv lock
          uv tool install .
          npm install -g \
            "@anthropic-ai/claude-code@$CLAUDE_VERSION" \
            "@openai/codex@$CODEX_VERSION" \
            "@github/copilot@$COPILOT_VERSION"
      - *budget-setup-done
      - name: Run ${{ matrix.test }}
        run: |
          uv run --with pexpect==4.9.0 --with pyte==0.8.2 \
            pytest --confcutdir=tests/e2e_cuj "tests/e2e_cuj/${{ matrix.test }}" -v \
            --basetemp "$RUNNER_TEMP/cuj" --junitxml="$RUNNER_TEMP/cuj-junit.xml"
        env:
          # The runner context is not available in a job-level env, only in steps.
          UG_LIVE_SHARD_REPORT: ${{ runner.temp }}/cuj-shard-report.json
      - name: Upload CUJ evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: e2e-cujs-${{ matrix.test }}${{ matrix.shard && '-shard' || '' }}${{ matrix.shard_index || '' }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cuj/*/artifacts/
            ${{ runner.temp }}/cuj-junit.xml
            ${{ runner.temp }}/cuj-shard-report.json
      - *budget-check

  # Checks the live lanes' shards together ran every case exactly once, and records fresh
  # per-case timings so tests/live_test_times.json can rebalance the shards when they drift.
  live-shard-times:
    name: ${{ inputs.mode == 'advisory' && 'Live shard coverage (runs in Integration)' || 'Live shard coverage' }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Live shard coverage
    if: ${{ !cancelled() && needs.full.result == 'success' && needs.anthropic-mps.result == 'success' && needs.dedicated-cuj.result == 'success' }}
    needs: [full, anthropic-mps, dedicated-cuj]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Mark live-shard checkout complete
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_COVERAGE_CHECKOUT_DONE=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: integration-full-claude-windows-latest-shard*
          path: ${{ runner.temp }}/shards
      - name: Mark full-shard download complete
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_COVERAGE_FULL_DONE=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: integration-anthropic-mps-claude-windows-latest-shard*
          path: ${{ runner.temp }}/shards
      - name: Mark MPS-shard download complete
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_COVERAGE_MPS_DONE=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: e2e-cujs-*shard*
          path: ${{ runner.temp }}/shards
      - name: Mark CUJ-shard download complete
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUDGET_COVERAGE_CUJ_DONE=$(date +%s)" >> "$GITHUB_ENV"
      - *budget-setup-done
      - name: Summarize live-shard setup
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          {
            echo '### Live shard coverage setup'
            echo '| Step | Elapsed (seconds) |'
            echo '| --- | ---: |'
            printf '| Checkout and clock start | %s |\n' "$((BUDGET_COVERAGE_CHECKOUT_DONE - BUDGET_JOB_STARTED))"
            printf '| Full-shard artifacts | %s |\n' "$((BUDGET_COVERAGE_FULL_DONE - BUDGET_COVERAGE_CHECKOUT_DONE))"
            printf '| MPS-shard artifacts | %s |\n' "$((BUDGET_COVERAGE_MPS_DONE - BUDGET_COVERAGE_FULL_DONE))"
            printf '| CUJ-shard artifacts | %s |\n' "$((BUDGET_COVERAGE_CUJ_DONE - BUDGET_COVERAGE_MPS_DONE))"
            printf '| Other setup | %s |\n' "$((BUDGET_RUN_STARTED - BUDGET_COVERAGE_CUJ_DONE))"
            echo 'Intervals include runner scheduling and timing-marker overhead.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the shards ran every case once and record fresh times
        run: python3 scripts/live_shard_times.py "$RUNNER_TEMP/shards" "$RUNNER_TEMP/live_test_times.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: live-test-times
          path: ${{ runner.temp }}/live_test_times.json
      - *budget-check

  cujs:
    name: ${{ inputs.mode == 'advisory' && 'All integration tests (runs in Integration)' || 'All integration tests' }}
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: All integration tests
    if: ${{ inputs.mode != 'advisory' && always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [installation, installation-windows, headless-windows, cowork-inference-windows, cowork-inference-macos, workspace, smoke, full, codex-relay, anthropic-mps, antigravity, managed, managed-smart, codex-desktop-macos, codex-desktop-windows, dedicated-cuj-plan, dedicated-cuj, live-shard-times]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - *budget-setup-done
      - name: Require every integration job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [job for job, result in results.items()
                    if result["result"] != "success"]
          if failed:
              raise SystemExit("Integration jobs did not pass: " + ", ".join(failed))
          print("All integration jobs passed: " + ", ".join(results))
          PY

      - *budget-check

  # OpenAI's appcast keeps every versioned macOS build, so the desktop app can be pinned by hash.

  codex-desktop-macos:
    name: ${{ inputs.mode == 'advisory' && 'Codex desktop inference · macOS (runs in Integration)' || 'Codex desktop inference · macOS' }}
    # Model ledgers reject observed overlap with managed lanes.
    if: ${{ !cancelled() && inputs.mode != 'advisory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Codex desktop inference · macOS
      DEPENDENCY: ${{ inputs.dependency }}
      # The desktop harness launches the app with CODEX_SPARKLE_ENABLED=false (the app's own
      # Sparkle gate, in tests/integration/utils/macos_app.py), so every journey runs exactly
      # this SHA-pinned build instead of a newer appcast one applied mid-job.
      CHATGPT_APP_VERSION: 26.1103.31037
      CHATGPT_APP_SHA256: 7bad147d40446192757dbfdd71e26529146823ade2bcc52b3d6e6525de816613
      TEST_MARKER: managed_fixture and macos_desktop and codex
      UG_MODEL_LEDGER: desktop
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      # The pinned build is a few hundred megabytes; cache it so only the hash check runs.
      - name: Cache the pinned ChatGPT app
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ChatGPT.zip
          key: chatgpt-app-macos-${{ env.CHATGPT_APP_VERSION }}-${{ env.CHATGPT_APP_SHA256 }}
      - name: Install the pinned ChatGPT desktop app
        run: |
          zip="$RUNNER_TEMP/ChatGPT.zip"
          if [ ! -f "$zip" ]; then
            curl -fsSL --retry 3 -o "$zip" "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-darwin-arm64-${CHATGPT_APP_VERSION}.zip"
          fi
          echo "$CHATGPT_APP_SHA256  $zip" | shasum -a 256 -c
          ditto -x -k "$zip" /Applications
      - *budget-setup-done
      - name: Complete a Codex turn in the desktop app against the managed e2e workspace
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
        run: |
          args=(--codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --desktop-app "${args[@]}" -- -m "$TEST_MARKER"
      - name: Build and validate observed desktop model ledger
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --python 3.12 python tests/integration/utils/traffic_ledger.py \
            "$RUNNER_TEMP/ug-integration" --lane desktop
      - name: Upload macOS desktop evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-codex-desktop-macos
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/

      - *budget-check

  # The app's updater feed (codex-app-prod/windows-release.json) names versioned MSIX builds that
  # OpenAI keeps, so the Windows app can be pinned by hash too.

  codex-desktop-windows:
    name: ${{ inputs.mode == 'advisory' && 'Codex desktop inference · Windows (runs in Integration)' || 'Codex desktop inference · Windows' }}
    # Both desktop lanes use the same model and workspace, so keep them serialized.
    needs: codex-desktop-macos
    if: ${{ !cancelled() && inputs.mode != 'advisory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BUDGET_WORKFLOW: integration
      BUDGET_JOB_NAME: Codex desktop inference · Windows
      DEPENDENCY: ${{ inputs.dependency }}
      CHATGPT_APP_VERSION: 26.1103.7773.0
      CHATGPT_APP_SHA256: c043c8032b7a1e6ab383252a910176405265ac3edbc909218d875fb284dea672
      TEST_MARKER: managed_fixture and windows_desktop and codex
      UG_MODEL_LEDGER: desktop
    steps:
      - *budget-start
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Expose the Databricks CLI on Windows
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/.bin/databricks.exe"
          cygpath -w "$RUNNER_TEMP/.bin" >> "$GITHUB_PATH"
      # The pinned build is a few hundred megabytes; cache it so only the hash check runs.
      - name: Cache the pinned ChatGPT app
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ChatGPT.msix
          key: chatgpt-app-windows-${{ env.CHATGPT_APP_VERSION }}-${{ env.CHATGPT_APP_SHA256 }}
      - name: Install the pinned ChatGPT desktop app
        shell: pwsh
        run: |
          $msix = Join-Path $env:RUNNER_TEMP 'ChatGPT.msix'
          if (-not (Test-Path -LiteralPath $msix)) {
            curl.exe -fsSL --retry 3 -o $msix "https://persistent.oaistatic.com/codex-app-prod/releases/$env:CHATGPT_APP_VERSION/ChatGPT-x64.msix"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ((Get-FileHash -LiteralPath $msix -Algorithm SHA256).Hash -ne $env:CHATGPT_APP_SHA256) {
            throw 'The ChatGPT MSIX does not match the pinned SHA256'
          }
          Add-AppxPackage -Path $msix
      - name: Compile UIA diagnostic observer
        shell: powershell
        run: |
          $observer = Join-Path $env:RUNNER_TEMP 'windows-uia-probe.dll'
          try {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $references = @([Windows.Automation.AutomationElement].Assembly.Location, [Windows.Automation.AutomationProperty].Assembly.Location)
            Add-Type -Path tests/integration/utils/windows_uia_probe.cs -ReferencedAssemblies $references -OutputAssembly $observer
          } catch {
            Write-Output "UIA diagnostic observer unavailable: $($_.Exception.GetType().Name)"
          }
          if (Test-Path -LiteralPath $observer) {
            "UG_UIA_PROBE_ASSEMBLY=$observer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - *budget-setup-done
      - name: Complete a Codex turn in the desktop app against the managed e2e workspace
        shell: bash
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
        run: |
          args=(--codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --desktop-app "${args[@]}" -- -m "$TEST_MARKER"
      - name: Build and validate observed desktop model ledger
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          uv run --no-project --python 3.12 python tests/integration/utils/traffic_ledger.py \
            "$RUNNER_TEMP/ug-integration" --lane desktop
      - name: Upload Windows desktop evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-codex-desktop-windows
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
      - *budget-check
