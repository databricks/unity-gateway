name: Integration

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; fork-integration.yml passes the PR head pinned by /integration-test
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ug_version:
        description: Exact ug release, or checkout
        default: checkout
        required: true
      entry_point:
        description: Console command (older releases may only have ucode)
        type: choice
        options: [ug, ucode]
        default: ug
      claude_version:
        description: Exact Claude Code version
        default: 2.1.290
        required: true
      codex_version:
        description: Exact Codex version
        default: 0.156.0
        required: true
      opencode_version:
        description: Exact OpenCode version (non-blocking lane)
        default: 1.18.31
        required: true
      copilot_version:
        description: Exact GitHub Copilot CLI version (non-blocking lane)
        default: 1.0.91
        required: true
      antigravity_build:
        description: Exact Antigravity CLI build, <version>-<build id> (Linux lane)
        default: 1.5.4-5037094733742080
        required: true
      dependency:
        description: Optional exact dependency for reproduction (e.g. tomlkit==0.14.0)
        default: ''
        required: false
      default_index:
        description: Python package index containing the requested ug version
        default: https://pypi.org/simple
        required: true

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  EXPECTED_WORKSPACE: https://eng-ml-inference-team-us-east-1.cloud.databricks.com
  UG_VERSION: ${{ inputs.ug_version || 'checkout' }}
  ENTRY_POINT: ${{ inputs.entry_point || 'ug' }}
  CLAUDE_VERSION: ${{ inputs.claude_version || '2.1.290' }}
  CODEX_VERSION: ${{ inputs.codex_version || '0.156.0' }}
  OPENCODE_VERSION: ${{ inputs.opencode_version || '1.18.31' }}
  COPILOT_VERSION: ${{ inputs.copilot_version || '1.0.91' }}
  ANTIGRAVITY_BUILD: ${{ inputs.antigravity_build || '1.5.4-5037094733742080' }}
  PACKAGE_INDEX: ${{ inputs.default_index || 'https://pypi.org/simple' }}
  CLAUDE_DESKTOP_WINDOWS_URL: https://downloads.claude.ai/releases/win32/x64/2.42304.2/Claude-af65c0e384c1657459441aac3083c6e622789afe.msix
  CLAUDE_DESKTOP_WINDOWS_SHA256: D737861F0DA3175C6B663172AF0E602494CD99FF1B350D57DAE5910A49519FC9
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  installation:
    name: Installation tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - name: Test a fresh installed package without credentials
        run: |
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" \
            --default-index "$PACKAGE_INDEX" --installation-only --output "$RUNNER_TEMP/ug-integration"
      - name: Upload installation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-installation
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  installation-windows:
    name: Windows installation tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - name: Test a fresh installed package without workspace credentials
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ug-integration"
          $runnerArgs = @(
            "--python", "3.12",
            "--ug-version", $env:UG_VERSION,
            "--entry-point", $env:ENTRY_POINT,
            "--claude-version", $env:CLAUDE_VERSION,
            "--default-index", $env:PACKAGE_INDEX,
            "--installation-only",
            "--output", $output
          )
          uv run --no-project --python 3.12 python scripts/run_integration.py @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-installation-windows
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  cowork-inference-windows:
    name: Cowork desktop tasks · Windows · ${{ matrix.source.name }}
    runs-on: windows-latest
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        source:
          - id: databricks
            name: Databricks Hosted
            provider: ''
            model: system.ai.claude-haiku-4-5
            relay: false
          - id: anthropic-relay
            name: Anthropic relay MPS
            provider: main.ucode.ci_e2e_anthropic_relay_mps
            model: claude-haiku-4-5-20251001
            relay: true
    env:
      PYTHONUTF8: 1
      UG_COWORK_PROVIDER: ${{ matrix.source.provider }}
      UG_COWORK_MODEL: ${{ matrix.source.model }}
      UG_COWORK_RELAY: ${{ matrix.source.relay }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Cowork test scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/cowork-inference/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & ./scripts/cowork-inference/test-diagnostics.ps1
          & ./scripts/cowork-inference/test-prepare-task.ps1
      - name: Download and verify the approved Claude installer
        shell: pwsh
        run: ./scripts/cowork-inference/download-desktop.ps1
      - name: Install UG checkout and pinned Claude CLI
        shell: pwsh
        run: ./scripts/cowork-inference/install-dependencies.ps1
      - name: Configure Desktop with existing CI credentials
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        id: cowork-inference
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork file read
        timeout-minutes: 10
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability file -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/file"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability skill -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/skill"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-${{ matrix.source.id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
            ${{ runner.temp }}/cowork-inference/file/
            ${{ runner.temp }}/cowork-inference/skill/
          if-no-files-found: warn

  cowork-inference-macos:
    name: Cowork desktop tasks · macOS · ${{ matrix.source.name }}
    runs-on: macos-15-intel
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source:
          - id: databricks
            name: Databricks Hosted
            provider: ''
            model: system.ai.claude-haiku-4-5
            relay: false
          - id: anthropic
            name: Anthropic MPS
            provider: main.ucode.ci_e2e_anthropic_nonrelay_mps
            model: claude-haiku-4-5-20251001
            relay: false
          - id: anthropic-relay
            name: Anthropic relay MPS
            provider: main.ucode.ci_e2e_anthropic_relay_mps
            model: claude-haiku-4-5-20251001
            relay: true
    env:
      UG_COWORK_PROVIDER: ${{ matrix.source.provider }}
      UG_COWORK_MODEL: ${{ matrix.source.model }}
      UG_COWORK_RELAY: ${{ matrix.source.relay }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - name: Install and verify Claude Desktop
        run: bash scripts/cowork-inference/macos/install-desktop.sh
      - name: Install UG checkout and pinned Claude CLI
        run: bash scripts/cowork-inference/macos/install-dependencies.sh
      - name: Configure and assert Cowork inference through macOS Accessibility
        id: cowork-inference
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py'
      - name: Assert Cowork file read
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability file'
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.cowork-inference.outcome == 'success' }}
        timeout-minutes: 19
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.source.relay && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: '"$UG_COWORK_PYTHON" scripts/cowork-inference/macos/terminal.py --capability skill'
      - name: Stop desktop processes
        if: always()
        run: |
          pkill -f '/Applications/Claude.app/Contents/' || test "$?" = 1
          pkill -x Terminal || test "$?" = 1
      - name: Upload Cowork inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-macos-${{ matrix.source.id }}
          retention-days: 3
          path: ${{ runner.temp }}/macos-cowork-evidence/
          if-no-files-found: warn

  workspace:
    name: Workspace validation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the existing e2e workspace and credential are configured
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          python3 - <<'PY'
          import os
          expected = os.environ["EXPECTED_WORKSPACE"].rstrip("/")
          actual = os.environ["UCODE_TEST_WORKSPACE"].strip().rstrip("/")
          if actual != expected:
              raise SystemExit("UCODE_TEST_WORKSPACE does not match the expected CI workspace.")
          if not os.environ["DATABRICKS_BEARER"].strip():
              raise SystemExit("The existing e2e DATABRICKS_BEARER secret is missing.")
          print("CI workspace matches; the existing e2e credential is present.")
          PY

  smoke:
    name: Smoke journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
    needs: workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude, codex]
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: live and smoke and ${{ matrix.agent }} and not soft_fail
      ARTIFACT_NAME: integration-smoke-${{ matrix.agent }}-${{ matrix.os }}
    steps: &live-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - &windows-cli-download-retries
        name: Bound Windows Databricks CLI download retries
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $curlHome = Join-Path $env:RUNNER_TEMP "databricks-cli-curl"
          New-Item -ItemType Directory -Force -Path $curlHome | Out-Null
          @(
            "retry = 3"
            "retry-all-errors"
            "retry-max-time = 60"
            "connect-timeout = 20"
            "max-time = 120"
          ) | Set-Content -Path (Join-Path $curlHome ".curlrc") -Encoding ascii
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        env:
          CURL_HOME: ${{ runner.temp }}/databricks-cli-curl
        with:
          version: 1.17.0
      - name: Expose the Databricks CLI on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/.bin/databricks.exe"
          cygpath -w "$RUNNER_TEMP/.bin" >> "$GITHUB_PATH"
      - name: Run the selected live cases against the e2e workspace
        shell: bash
        run: |
          case "$AGENT" in
            claude) args=(--claude-version "$CLAUDE_VERSION") ;;
            codex) args=(--codex-version "$CODEX_VERSION") ;;
            opencode) args=(--opencode-version "$OPENCODE_VERSION") ;;
            copilot) args=(--copilot-version "$COPILOT_VERSION") ;;
            antigravity) args=(--antigravity-build "$ANTIGRAVITY_BUILD") ;;
          esac
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --npm-registry "$NPM_REGISTRY" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Upload live test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/
      # Claude Desktop runs only in the Windows Claude anthropic-mps lane; see scripts/cowork-inference/README.md.
      - name: Install Claude Desktop
        id: desktop-install
        if: ${{ !cancelled() && env.UG_COWORK_DESKTOP == 'true' }}
        shell: pwsh
        run: ./scripts/cowork-inference/download-desktop.ps1
      - name: Install the Desktop UG runtime and Claude CLI
        id: desktop-dependencies
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        shell: pwsh
        env:
          UG_COWORK_PACKAGE_INDEX: ${{ env.PACKAGE_INDEX }}
          UG_COWORK_NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
        run: |
          ./scripts/cowork-inference/install-dependencies.ps1
          # Desktop's credential helper reruns this, so tokens outlive the one-hour M2M token.
          $python = Join-Path $env:RUNNER_TEMP 'desktop-ug-runtime/Scripts/python.exe'
          $mint = Join-Path $env:GITHUB_WORKSPACE 'scripts/cowork-inference/bearer-token.py'
          "DATABRICKS_BEARER_COMMAND=`"$python`" `"$mint`"" | Add-Content $env:GITHUB_ENV
      - name: Configure Desktop for the staging Anthropic MPS
        id: desktop-configure
        if: ${{ !cancelled() && steps.desktop-dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/cowork-inference/configure.ps1
      - name: Assert Cowork inference through Windows UI Automation
        id: desktop-inference
        if: ${{ !cancelled() && steps.desktop-configure.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-inference.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/cowork-inference"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork file read
        if: ${{ !cancelled() && steps.desktop-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability file -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/file"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert Cowork skill execution
        if: ${{ !cancelled() && steps.desktop-inference.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          & "$PSHOME/pwsh.exe" -NoProfile -STA -File scripts/cowork-inference/test-task.ps1 `
            -Capability skill -OutputDirectory "$env:RUNNER_TEMP/cowork-inference/skill"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Cowork evidence
        if: ${{ !cancelled() && steps.desktop-install.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cowork-inference-anthropic
          retention-days: 3
          path: |
            ${{ runner.temp }}/cowork-inference/*.json
            ${{ runner.temp }}/cowork-inference/*.png
            ${{ runner.temp }}/cowork-inference/native-*.log
            ${{ runner.temp }}/cowork-inference/file/
            ${{ runner.temp }}/cowork-inference/skill/
          if-no-files-found: warn

  anthropic-mps:
    name: Anthropic MPS - Staging workspace · ${{ matrix.agent == 'claude' && 'Claude' || 'Copilot' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}${{ matrix.agent == 'copilot' && ' (non-blocking)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: ${{ matrix.agent == 'copilot' }}
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.os == 'windows-latest' && 'windows-server-latest' || 'linux-ubuntu-latest' }}
    # The Windows Claude lane also runs the Cowork Desktop tasks.
    timeout-minutes: ${{ matrix.agent == 'copilot' && 30 || matrix.os == 'windows-latest' && 85 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude, copilot]
    env:
      PACKAGE_INDEX: https://pypi-proxy.cloud.databricks.com/simple
      NPM_REGISTRY: https://npm-proxy.cloud.databricks.com
      UCODE_TEST_WORKSPACE: https://dbc-1bb9e8f5-bf3a.staging.cloud.databricks.com
      DATABRICKS_CLIENT_ID: 39206fba-a07b-4954-b8f9-4a1c9c069bba
      DATABRICKS_CLIENT_SECRET: ${{ secrets.UG_ANTHROPIC_MPS_CLIENT_SECRET }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: anthropic_mps and ${{ matrix.agent }}
      ARTIFACT_NAME: integration-anthropic-mps-${{ matrix.agent }}-${{ matrix.os }}
      # Desktop jobs skip merge-group runs, like the other Cowork lanes.
      UG_COWORK_DESKTOP: ${{ github.event_name != 'merge_group' && matrix.os == 'windows-latest' && matrix.agent == 'claude' }}
      UG_COWORK_PROVIDER: main.ucode.dont_delete_ci_company_anthropic_mps
      UG_COWORK_MODEL: claude-haiku-4-5-20251001
      UG_COWORK_RELAY: false
    steps: *live-steps

  headless-windows:
    name: Windows headless journey · Claude
    needs: workspace
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DEPENDENCY: ${{ inputs.dependency }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - *windows-cli-download-retries
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        env:
          CURL_HOME: ${{ runner.temp }}/databricks-cli-curl
        with:
          version: 1.17.0
      - name: Expose the Databricks CLI to native PowerShell
        shell: pwsh
        run: |
          $databricks = Join-Path $env:RUNNER_TEMP ".bin/databricks.exe"
          if (-not (Test-Path -LiteralPath $databricks -PathType Leaf)) {
            throw "setup-cli did not install the expected executable: $databricks"
          }
          Split-Path -Parent $databricks |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $databricks version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and complete a real headless gateway task
        shell: pwsh
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ug-integration"
          $runnerArgs = @(
            "--python", "3.12",
            "--ug-version", $env:UG_VERSION,
            "--entry-point", $env:ENTRY_POINT,
            "--claude-version", $env:CLAUDE_VERSION,
            "--default-index", $env:PACKAGE_INDEX,
            "--headless-only",
            "--output", $output
          )
          if ($env:DEPENDENCY) { $runnerArgs += @("--dependency", $env:DEPENDENCY) }
          uv run --no-project --python 3.12 python scripts/run_integration.py @runnerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows headless evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-headless-windows-claude
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  full:
    name: Full journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}${{ matrix.smart_routing && ' · Smart routing' || '' }}
    if: ${{ !cancelled() && needs.workspace.result == 'success' }}
    needs: [workspace, smoke]
    runs-on: ${{ matrix.os }}
    # The runner enforces its own 3600s pytest deadline; keep the job above it
    # so a slow run fails through the runner's report instead of a job kill.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      # Native Codex routing needs a newer binary; other journeys retain the baseline.
      max-parallel: 4
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude, codex]
        smart_routing: [false]
        include:
          - os: ubuntu-22.04
            agent: codex
            smart_routing: true
          - os: windows-latest
            agent: codex
            smart_routing: true
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      CODEX_VERSION: ${{ matrix.smart_routing && '0.165.0' || inputs.codex_version || '0.156.0' }}
      # Smoke cases already ran on this OS in the smoke job; don't repeat them here.
      TEST_MARKER: live and ${{ matrix.agent }} and not soft_fail and not smoke and not anthropic_mps and ${{ matrix.smart_routing && 'codex_smart_routing' || 'not codex_smart_routing' }}
      ARTIFACT_NAME: integration-full-${{ matrix.agent }}-${{ matrix.os }}${{ matrix.smart_routing && '-smart-routing' || '' }}
    steps: *live-steps

  # See tests/integration/README.md#soft-fail-tests for supported cases and restoration criteria.
  soft-fail:
    name: Soft-fail journeys · ${{ matrix.agent }} · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
    if: ${{ !cancelled() && needs.workspace.result == 'success' }}
    needs: [workspace, full, managed]
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, windows-latest]
        agent: [claude]
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: live and ${{ matrix.agent }} and soft_fail
      ARTIFACT_NAME: integration-soft-fail-${{ matrix.agent }}-${{ matrix.os }}
    steps: *live-steps

  # Non-blocking: continue-on-error and absent from the cujs `needs`, so a flaky OpenCode
  # leg cannot block merges. Add it to cujs once the lane is stable.
  opencode:
    name: Full journeys · OpenCode · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
    if: ${{ !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 30
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: opencode
      TEST_MARKER: live and opencode
      ARTIFACT_NAME: integration-full-opencode-${{ matrix.os }}
    steps: *live-steps

  # Non-blocking pending stabilization, like OpenCode: continue-on-error and absent from the
  # cujs `needs`.
  copilot:
    name: Full journeys · Copilot · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (non-blocking)
    if: ${{ !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 30
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: copilot
      TEST_MARKER: live and copilot and not anthropic_mps
      ARTIFACT_NAME: integration-full-copilot-${{ matrix.os }}
    steps: *live-steps

  # Blocking: part of the cujs gate. Linux only: Antigravity CLI's gateway mode supports macOS
  # and Linux, and ug installs no Windows build.
  antigravity:
    name: Full journeys · Antigravity · Linux
    if: ${{ !cancelled() && needs.workspace.result == 'success' }}
    needs: workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: antigravity
      TEST_MARKER: live and antigravity
      ARTIFACT_NAME: integration-full-antigravity-ubuntu-22.04
    steps: *live-steps

  # Non-blocking pending stabilization: continue-on-error and absent from the cujs `needs`.
  # Runs on the managed e2e workspace with an injected config that enables Claude/Codex but not
  # OpenCode (a service principal authenticates it, like the `managed` lane).
  managed-opencode:
    name: Managed OpenCode self-managed (non-blocking)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
      DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
      DEPENDENCY: ${{ inputs.dependency }}
      TEST_MARKER: managed_fixture and opencode
      ARTIFACT_NAME: integration-managed-opencode
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Run the self-managed OpenCode journey against the managed workspace
        shell: bash
        run: |
          # Bare `ug configure` applies the admin's Claude/Codex agents, and the journey launches
          # OpenCode, so all three CLIs must be installed.
          args=(--claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" --opencode-version "$OPENCODE_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Upload managed OpenCode evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  # This general managed lane is Linux-only; anthropic-mps covers Claude MPS managed
  # settings on Windows too. Dedicated CUJs require POSIX PTYs.
  managed:
    name: Managed config · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }}${{ matrix.smart_routing && ' · Smart routing' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agent: [claude, codex]
        smart_routing: [false]
        include:
          - agent: codex
            smart_routing: true
    env:
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      CODEX_VERSION: ${{ matrix.smart_routing && '0.165.0' || inputs.codex_version || '0.156.0' }}
      ARTIFACT_NAME: integration-managed-${{ matrix.agent }}${{ matrix.smart_routing && '-smart-routing' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Run the managed cases against the managed e2e workspace
        shell: bash
        env:
          # The managed workspace authenticates as a service principal; the runner mints a
          # short-lived token from these standard Databricks client-credential variables.
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
          UCODE_TEST_SECOND_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_SECOND_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          # A managed config enables both agents and `ug configure` applies it to every enabled
          # agent, so both CLIs must be installed even though this lane asserts only one agent.
          args=(--claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "(managed_fixture or workspace_switch) and $AGENT and not soft_fail and not anthropic_mps and ${{ matrix.smart_routing && 'codex_smart_routing' || 'not codex_smart_routing' }}"
      - name: Upload managed test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  dedicated-cuj-plan:
    name: Plan E2E CUJs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cujs: ${{ steps.discover.outputs.cujs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Discover every E2E CUJ file
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          cujs=$(for path in tests/e2e_cuj/test_*.py; do
            name=$(sed -n 's/^CUJ_NAME = "\(.*\)"$/\1/p' "$path")
            [ -n "$name" ] || { echo "$path must define CUJ_NAME" >&2; exit 1; }
            jq -nc --arg test "${path##*/}" --arg name "$name" '{test: $test, name: $name}'
          done | jq -sc .)
          echo "cujs=$cujs" >> "$GITHUB_OUTPUT"

  dedicated-cuj:
    name: E2E CUJs · ${{ matrix.name }}
    # CUJ definitions: https://docs.google.com/document/d/1WKd1fdWD0Y4tAV1H9Si-SGx2UZFL7iZ2S3HtBjidmS0/edit?usp=drive_web&ouid=117446678071138243519
    # One runner per file: CUJs own separate workspaces but share machine-wide /etc agent settings.
    needs: dedicated-cuj-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dedicated-cuj-plan.outputs.cujs) }}
    env:
      CODEX_VERSION: ${{ matrix.test == 'test_cuj4_smart_routing.py' && '0.165.0' || inputs.codex_version || '0.156.0' }}
      UV_INDEX_URL: https://pypi.org/simple
      # Every CUJ runner installs from PyPI at once; ride out slow responses instead of failing a shard.
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "6"
      UG_CUJ1_WORKSPACE: ${{ secrets.UG_CUJ1_WORKSPACE }}
      UG_CUJ_SP_CLIENT_ID: ${{ secrets.UG_CUJ_SP_CLIENT_ID }}
      UG_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_CUJ_SP_CLIENT_SECRET }}
      UG_BUDGET_CUJ_SP_CLIENT_ID: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_ID }}
      UG_BUDGET_CUJ_SP_CLIENT_SECRET: ${{ secrets.UG_BUDGET_CUJ_SP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Install ug and agent CLIs
        run: |
          uv lock
          uv tool install .
          npm install -g \
            "@anthropic-ai/claude-code@$CLAUDE_VERSION" \
            "@openai/codex@$CODEX_VERSION"
      - name: Run ${{ matrix.test }}
        run: |
          uv run --with pexpect==4.9.0 --with pyte==0.8.2 \
            pytest --confcutdir=tests/e2e_cuj "tests/e2e_cuj/${{ matrix.test }}" -v --basetemp "$RUNNER_TEMP/cuj"
      - name: Upload CUJ evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-cujs-${{ matrix.test }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: ${{ runner.temp }}/cuj/*/artifacts/

  cujs:
    name: All integration tests
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [installation, installation-windows, headless-windows, cowork-inference-windows, cowork-inference-macos, workspace, smoke, full, anthropic-mps, antigravity, managed, codex-desktop-macos, dedicated-cuj-plan, dedicated-cuj]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every integration job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [job for job, result in results.items()
                    if result["result"] != "success"]
          if failed:
              raise SystemExit("Integration jobs did not pass: " + ", ".join(failed))
          print("All integration jobs passed: " + ", ".join(results))
          PY

  # OpenAI's appcast keeps every versioned macOS build, so the desktop app can be pinned by hash.
  codex-desktop-macos:
    name: Codex desktop inference · macOS
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEPENDENCY: ${{ inputs.dependency }}
      CHATGPT_APP_VERSION: 26.1103.31037
      CHATGPT_APP_SHA256: 7bad147d40446192757dbfdd71e26529146823ade2bcc52b3d6e6525de816613
      TEST_MARKER: managed_fixture and macos_desktop and codex
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.13.5
          enable-cache: ${{ inputs.ref == '' }}
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Install the pinned ChatGPT desktop app
        run: |
          zip="$RUNNER_TEMP/ChatGPT.zip"
          curl -fsSL --retry 3 -o "$zip" "https://persistent.oaistatic.com/codex-app-prod/ChatGPT-darwin-arm64-${CHATGPT_APP_VERSION}.zip"
          echo "$CHATGPT_APP_SHA256  $zip" | shasum -a 256 -c
          ditto -x -k "$zip" /Applications
      - name: Complete a Codex turn in the desktop app against the managed e2e workspace
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
        run: |
          args=(--codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            --macos-desktop "${args[@]}" -- -m "$TEST_MARKER"
      - name: Upload macOS desktop evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-codex-desktop-macos
          include-hidden-files: true
          path: |
