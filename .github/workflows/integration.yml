name: Integration

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      suite:
        description: Which integration checks to run
        type: choice
        options: [full, smoke, live, tui, installation]
        default: full
      ug_version:
        description: Exact ug release, or checkout
        default: checkout
        required: true
      entry_point:
        description: Console command (older releases may only have ucode)
        type: choice
        options: [ug, ucode]
        default: ug
      claude_version:
        description: Exact Claude Code version
        default: 2.1.268
        required: true
      codex_version:
        description: Exact Codex version
        default: 0.154.0
        required: true
      dependency:
        description: Optional exact dependency for reproduction (e.g. tomlkit==0.14.0)
        default: ''
        required: false
      default_index:
        description: Python package index containing the requested ug version
        default: https://pypi.org/simple
        required: true

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  EXPECTED_WORKSPACE: https://eng-ml-inference-team-us-east-1.cloud.databricks.com
  UG_VERSION: ${{ inputs.ug_version || 'checkout' }}
  ENTRY_POINT: ${{ inputs.entry_point || 'ug' }}
  CLAUDE_VERSION: ${{ inputs.claude_version || '2.1.268' }}
  CODEX_VERSION: ${{ inputs.codex_version || '0.154.0' }}
  PACKAGE_INDEX: ${{ inputs.default_index || 'https://pypi.org/simple' }}

jobs:
  installation:
    name: Installation tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - name: Test a fresh installed package without credentials
        run: |
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION" \
            --default-index "$PACKAGE_INDEX" --installation-only --output "$RUNNER_TEMP/ug-integration"
      - name: Upload installation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: integration-installation
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  workspace:
    name: Workspace validation
    if: ${{ inputs.suite != 'installation' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the existing e2e workspace and credential are configured
        env:
          UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
          DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
        run: |
          python3 - <<'PY'
          import os
          expected = os.environ["EXPECTED_WORKSPACE"].rstrip("/")
          actual = os.environ["UCODE_TEST_WORKSPACE"].strip().rstrip("/")
          if actual != expected:
              raise SystemExit("UCODE_TEST_WORKSPACE does not match the expected CI workspace.")
          if not os.environ["DATABRICKS_BEARER"].strip():
              raise SystemExit("The existing e2e DATABRICKS_BEARER secret is missing.")
          print("CI workspace matches; the existing e2e credential is present.")
          PY

  smoke:
    name: Smoke journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }}
    if: ${{ inputs.suite != 'tui' }}
    needs: workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: live and smoke and ${{ matrix.agent }}
      ARTIFACT_NAME: integration-smoke-${{ matrix.agent }}
    steps: &live-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
        with:
          version: 1.17.0
      - name: Run the selected live cases against the e2e workspace
        shell: bash
        run: |
          case "$AGENT" in
            claude) args=(--claude-version "$CLAUDE_VERSION") ;;
            codex) args=(--codex-version "$CODEX_VERSION") ;;
          esac
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "$TEST_MARKER"
      - name: Upload live test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  full:
    name: Full journeys · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }}
    if: ${{ !cancelled() && inputs.suite != 'smoke' && needs.workspace.result == 'success' }}
    needs: [workspace, smoke]
    runs-on: ubuntu-22.04
    # The runner enforces its own 3600s pytest deadline; keep the job above it
    # so a slow run fails through the runner's report instead of a job kill.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      # One VM per agent: reuse its install and run its cases serially. Allow
      # Claude and Codex to overlap, but never launch concurrent same-agent shards.
      max-parallel: 2
      matrix:
        agent: [claude, codex]
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      TEST_MARKER: ${{ inputs.suite == 'tui' && 'live and tui' || 'live' }} and ${{ matrix.agent }}
      ARTIFACT_NAME: integration-full-${{ matrix.agent }}
    steps: *live-steps

  managed:
    name: Managed config · ${{ matrix.agent == 'claude' && 'Claude' || 'Codex' }}
    if: ${{ inputs.suite != 'installation' && inputs.suite != 'smoke' && inputs.suite != 'tui' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    # Kept non-blocking for now: the managed workspace (E2E_ADMIN_WORKSPACE) is repointed to
    # runner-reachable ca-central, but leave these lanes for signal until the managed-config apply
    # path is proven stable. Then drop this and add `managed` to the required set.
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agent: [claude, codex]
    env:
      DEPENDENCY: ${{ inputs.dependency }}
      AGENT: ${{ matrix.agent }}
      ARTIFACT_NAME: integration-managed-${{ matrix.agent }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.19.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: 0.9.8
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
      - name: Run the managed cases against the managed e2e workspace
        shell: bash
        env:
          # The managed workspace authenticates as a service principal; the runner mints a
          # short-lived token from these standard Databricks client-credential variables.
          UCODE_TEST_WORKSPACE: ${{ secrets.E2E_ADMIN_WORKSPACE }}
          DATABRICKS_CLIENT_ID: ${{ secrets.E2E_ADMIN_SP_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.E2E_ADMIN_SP_CLIENT_SECRET }}
          # Durable SP-minted PAT for the MDM `--use-pat` journeys (the runner's own token
          # is hourly M2M; the `_via_pat` tests need a real auth_type=pat profile).
          E2E_ADMIN_SP_PAT: ${{ secrets.E2E_ADMIN_SP_PAT }}
        run: |
          # A managed config enables both agents and `ug configure` applies it to every enabled
          # agent, so both CLIs must be installed even though this lane asserts only one agent.
          args=(--claude-version "$CLAUDE_VERSION" --codex-version "$CODEX_VERSION")
          if [[ -n "$DEPENDENCY" ]]; then
            args+=(--dependency "$DEPENDENCY")
          fi
          uv run --no-project --python 3.12 python scripts/run_integration.py \
            --python 3.12 --ug-version "$UG_VERSION" --entry-point "$ENTRY_POINT" \
            --default-index "$PACKAGE_INDEX" --output "$RUNNER_TEMP/ug-integration" \
            "${args[@]}" -- -m "(managed or managed_fixture) and $AGENT"
      - name: Upload managed test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ug-integration/*.json
            ${{ runner.temp }}/ug-integration/*.txt
            ${{ runner.temp }}/ug-integration/*.xml
            ${{ runner.temp }}/ug-integration/*.log
            ${{ runner.temp }}/ug-integration/artifacts/
            ${{ runner.temp }}/ug-integration/wheels/

  cujs:
    name: All integration tests
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [installation, workspace, smoke, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected integration job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          SUITE: ${{ inputs.suite || 'full' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          suite = os.environ["SUITE"]
          required = ["installation"]
          if suite != "installation":
              required.append("workspace")
              if suite != "tui":
                  required.append("smoke")
              if suite != "smoke":
                  required.append("full")
          # `managed` is intentionally omitted while it is non-blocking (see its job comment).
          failed = [job for job in required if results[job]["result"] != "success"]
          if failed:
              raise SystemExit("Integration jobs did not pass: " + ", ".join(failed))
          print("All selected integration jobs passed: " + ", ".join(required))
          PY
