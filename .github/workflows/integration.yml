name: Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  antigravity-request-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Capture native thinking configuration without credentials
        run: /usr/bin/python3 scripts/diagnose_antigravity_thinking.py
