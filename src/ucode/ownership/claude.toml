# Ownership table for Claude Code's machine-wide managed-settings.json.
#
# `ug configure --global` (with a published agent configuration) builds the managed file from four layers:
#   UG defaults < admin agent_native_settings < feature requirements < gateway requirements
# This table says how UG treats each Claude Code key. Every key not listed passes through
# from agent_native_settings unchanged.
#
# Fields:
#   path             Dotted settings path, e.g. "env.ANTHROPIC_BASE_URL".
#   class            reserved | conditionally_reserved | default | shared_list
#   feature          For conditionally_reserved: tracing | models | smart_routing
#   in_managed_file  false: UG never writes the key into the managed file, and the admin's value
#                    is still dropped (defaults to true).
#   value            For default: the constant UG writes unless the admin sets the key.
#   note             Shown to admins in the docs and in the run report.
#
# After editing, regenerate the admin docs:
#   uv run python -m ucode.ownership --write docs/admin-managed-settings.md
# CI fails when the docs or the claude.py constants disagree with this file.

agent = "claude"
display = "Claude Code"

[[entry]]
path = "apiKeyHelper"
class = "reserved"
note = "Runs `ug auth-token`, which signs in as the developer."

[[entry]]
path = "env.ANTHROPIC_BASE_URL"
