[[managed_settings]]
path = "env.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT"
class = "conditionally_reserved"
feature = "tracing"
note = "Unity Gateway tracing and your own OTEL export can't run together."

[[managed_settings]]
path = "env.CLAUDE_CODE_OTEL_HEADERS_HELPER_DEBOUNCE_MS"
class = "conditionally_reserved"
feature = "tracing"
note = "Unity Gateway tracing and your own OTEL export can't run together."

[[managed_settings]]
path = "env.CLAUDE_CODE_PROPAGATE_TRACEPARENT"
class = "conditionally_reserved"
feature = "tracing"
note = "Unity Gateway tracing and your own OTEL export can't run together."

[[managed_settings]]
path = "otelHeadersHelper"
class = "conditionally_reserved"
feature = "tracing"
note = "Claude Code applies this helper to every OTEL signal, so your exporters would get Unity Gateway's headers."

[[managed_settings]]
path = "managedMcpServers"
class = "reserved"
note = "Unity Gateway writes the Databricks MCP servers from `mcp_servers` in the agent configuration."

[[managed_settings]]
path = "allowedMcpServers"
class = "shared_list"
note = "When you set an allowlist, Unity Gateway adds its MCP servers to it."

[[managed_settings]]
path = "env.ENABLE_PROMPT_CACHING_1H"
class = "default"
value = "1"
note = "1-hour prompt caching."

[[managed_settings]]
path = "env.ENABLE_TOOL_SEARCH"
class = "default"
value = "true"
note = "Loads MCP tools on demand."

[[managed_settings]]
path = "permissions.deny"
class = "shared_list"
note = "Unity Gateway adds `WebSearch`, because the gateway rejects Claude's hosted web search."
